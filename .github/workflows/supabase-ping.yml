# Hält das Supabase-Projekt "Curafact Studio" wach: Gratisprojekte werden nach einer Woche ohne Aktivität pausiert.
# Ruft alle zwei Tage die Health-Aktion von studio-api auf (fragt die Datenbank einmal ab, es werden keine Daten übertragen).
name: Supabase wachhalten
on:
  schedule:
    - cron: '17 5 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health-Check studio-api
        run: |
          curl -fsS -m 30 -X POST "https://vdqumlxjmgqrmwlxqwre.supabase.co/functions/v1/studio-api" \
            -H "Content-Type: application/json" -d '{"action":"health"}'
