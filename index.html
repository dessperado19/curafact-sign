<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curafact – Kunden</title><link rel="stylesheet" href="cf.css?v=9"></head><body>

<div id="loginBox" class="loginWrap hidden"><div class="cfPanel">
  <img src="logo.png" alt="Curafact">
  <h2 style="border:0;margin-bottom:4px">Anmelden</h2>
  <p class="mini" style="margin-top:0">Benutzername und der 6-stellige Code aus der Authenticator-App.</p>
  <label for="loginUser">Benutzername</label><input class="cfInput" id="loginUser" autocomplete="username" placeholder="z. B. onder">
  <label for="loginCode">Code</label><input class="cfInput" id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" style="letter-spacing:6px;text-align:center;font-size:20px">
  <div class="err" id="loginErr"></div>
  <button class="primaryBtn" id="loginBtn" style="width:100%;margin-top:8px">Anmelden</button>
</div></div>

<div id="appBox" class="cfApp hidden">
  <aside class="cfSide"><div id="sideNav"></div><div class="who">Angemeldet als <strong id="whoName"></strong><br><button id="logoutBtn" style="margin-top:8px;width:100%">Abmelden</button></div></aside>
  <aside class="cfRail">
    <div class="railHead"><h2>Kunden</h2><span class="cfCount" id="custCount">0</span></div>
    <input class="cfSearch" id="custSearch" placeholder="Kunde suchen…">
    <div class="cfList" id="custList"><div class="empty">Lade Kunden …</div></div>
    <button id="faNewBtn">Neuer Kunde per Link / QR</button>
  </aside>
  <main class="cfMain" id="detail"><div class="empty">Bitte links einen Kunden auswählen.</div></main>
</div>

<div id="modal" class="modalOverlay hidden"><div class="modalBox">
  <h3 id="mTitle">Fernaufnahme</h3><p class="mini" id="mLabel"></p><div id="mQr" style="text-align:center;margin:10px 0"></div>
  <p class="mini" id="mUrl" style="word-break:break-all"></p>
  <div class="actions"><button id="mOpen">Link öffnen</button><button id="mShare">Teilen</button><button id="mCopy">Link kopieren</button><button id="mClose">Schließen</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="kfc.js"></script><script src="cf-calc.js?v=9"></script><script src="cf-form.js?v=9"></script><script src="cf-api.js?v=9"></script>
<script>
function $(id){return document.getElementById(id)}
var esc=CFC.esc;
var customers=[],cur=null,editMode=false,abzugAnzeige=null;
document.getElementById('sideNav').innerHTML=cfSide('kunden');

/* ---------- Anmeldung ---------- */
function zeigeLogin(msg){$('appBox').classList.add('hidden');$('loginBox').classList.remove('hidden');$('loginErr').textContent=msg||'';$('loginCode').value='';setTimeout(function(){($('loginUser').value?$('loginCode'):$('loginUser')).focus()},50)}
CFAPI.onExpired=function(){zeigeLogin('Sitzung abgelaufen. Bitte erneut anmelden.')};
async function doLogin(){
  $('loginErr').textContent='';var u=$('loginUser').value.trim(),c=$('loginCode').value.trim();
  if(!u||!c){$('loginErr').textContent='Bitte Benutzername und Code eingeben.';return}
  $('loginBtn').disabled=true;var r=await CFAPI.login(u,c);$('loginBtn').disabled=false;
  if(r&&r.ok){try{localStorage.setItem('curafact_web_user',u)}catch(e){}starteApp()}else $('loginErr').textContent=(r&&r.message)||'Anmeldung fehlgeschlagen.';
}
$('loginBtn').onclick=doLogin;$('loginCode').onkeydown=function(e){if(e.key==='Enter')doLogin()};
$('logoutBtn').onclick=async function(){await CFAPI.logout();cur=null;zeigeLogin('')};
function starteApp(){
  $('loginBox').classList.add('hidden');$('appBox').classList.remove('hidden');
  $('whoName').textContent=(CFAPI.user&&CFAPI.user.display_name)||'';
  ladeKunden();
}

/* ---------- Kundenliste ---------- */
async function ladeKunden(){
  var r=await CFAPI.call('web_customers');
  if(!r||!r.ok){if(!(r&&r.auth_required))$('custList').innerHTML='<div class="empty">'+esc((r&&r.message)||'Kunden konnten nicht geladen werden.')+'</div>';return}
  customers=r.customers||[];renderListe();
}
function renderListe(){
  var q=$('custSearch').value.trim().toLowerCase(),list=customers.filter(function(c){return !q||String(c.name||'').toLowerCase().indexOf(q)>=0});
  $('custCount').textContent=list.length;
  var dup={};customers.forEach(function(c){dup[c.name]=(dup[c.name]||0)+1});
  $('custList').innerHTML=list.length?list.map(function(c){return '<button class="cfCust'+(cur&&cur.file===c.file?' sel':'')+'" data-f="'+esc(c.file)+'"><strong>'+esc(c.name)+'</strong><small>'+esc([c.kasse,c.pflegegrad].filter(Boolean).join(' · '))+(dup[c.name]>1?' · Datei: '+esc(c.file):'')+(c.pending_edit?' · <b style="color:#8a5a00">Web-Änderung</b>':'')+'</small></button>'}).join(''):'<div class="empty">Keine Kunden gefunden.</div>';
}
$('custSearch').oninput=renderListe;
$('custList').onclick=function(e){var b=e.target.closest('.cfCust');if(b)oeffneKunde(b.dataset.f)};

async function oeffneKunde(file){
  editMode=false;abzugAnzeige=null;
  $('detail').innerHTML='<div class="empty">Lade …</div>';
  var r=await CFAPI.call('web_customer',{file:file});
  if(!r||!r.ok){$('detail').innerHTML='<div class="empty">'+esc((r&&r.message)||'Kunde konnte nicht geladen werden.')+'</div>';return}
  cur={file:file,data:r.customer,pending:r.pending||0};
  renderListe();renderDetail();ladeNotizen();
}

/* ---------- Detailansicht ---------- */
function dl(label,val){return '<div><label>'+label+'</label><span>'+(val?esc(val):'—')+'</span></div>'}
function pgTabelle(d){
  var rows=Array.isArray(d.pflegegrade)?d.pflegegrade:[];
  if(!rows.length)return '<p class="mini">Keine Pflegegrade erfasst.</p>';
  function cell(v){var s=String(v==null?'':v).trim();if(!s)return '<td>—</td>';return CFC.parseDE(s)?'<td>'+esc(s)+'</td>':'<td class="bad" title="Kein gültiges Datum – bitte korrigieren">'+esc(s)+' ⚠</td>'}
  return '<div class="tablewrap"><table class="cfTable"><thead><tr><th>Stufe</th><th>Seit</th><th>Bis</th><th>Fortlaufend</th><th>Entlastung genommen</th></tr></thead><tbody>'+
    rows.map(function(p){return '<tr><td>PG'+esc(p.stufe)+'</td>'+cell(p.von)+cell(p.bis)+'<td>'+(p.fortlaufend?'Ja':'Nein')+'</td><td>'+(p.entlastung_genommen?'Ja':'Nein')+'</td></tr>'}).join('')+'</tbody></table></div>';
}
function vpTabelle(d){
  var rows=Array.isArray(d.verhinderungspflege)?d.verhinderungspflege:[];
  if(!rows.length)return '<p class="mini">Keine Verhinderungspflege erfasst.</p>';
  return '<div class="tablewrap"><table class="cfTable"><thead><tr><th>Jahr</th><th>Genommen</th><th>Betrag / Rest</th><th>Von</th><th>Bis</th></tr></thead><tbody>'+
    rows.map(function(v){return '<tr><td>'+esc(v.jahr)+'</td><td>'+(v.genommen?'Ja':'Nein')+'</td><td>'+esc(v.betrag||'')+'</td><td>'+esc(v.start||'')+'</td><td>'+esc(v.ende||'')+'</td></tr>'}).join('')+'</tbody></table></div>';
}
function helperPrefixe(d){var n=new Set();Object.keys(d).forEach(function(k){var m=k.match(/^hilfe(\d*)_/);if(m)n.add(m[1]===''?1:+m[1])});return Array.from(n).sort(function(a,b){return a-b})}
function renderDetail(){
  var d=cur.data,warn=CFC.pruefePhasen(d.pflegegrade);
  var h='<div class="cfTop"><div><h1>'+esc(d.pflege_name||'Kunde')+'</h1><p>'+esc([d.pflege_kasse,d.pflege_kvnr].filter(Boolean).join(' · '))+'</p></div><div class="actions">'+
    (editMode?'<button class="primaryBtn" id="btnSave">Speichern</button><button id="btnCancel">Abbrechen</button>':'<button class="primaryBtn" id="btnEdit">Bearbeiten</button><button id="btnClickup">In ClickUp öffnen</button><button id="btnFaEdit">Fernaufnahme (Änderungen)</button>')+'</div></div>';
  if(cur.pending||d._portal_edit)h+='<div class="note">Im Web geändert'+(d._portal_edit?' von '+esc(d._portal_edit.by||'')+' am '+esc(new Date(d._portal_edit.at).toLocaleString('de-DE')):'')+(cur.pending?' – '+cur.pending+' Änderung(en) noch nicht in Studio übernommen (Studio zeigt sie beim nächsten Start an).':'')+'</div>';
  if(warn.length&&!editMode)h+='<div class="note noteBad"><b>Datum prüfen:</b> '+warn.map(function(w){return esc('Pflegegrad-Zeile '+(w.zeile+1)+' ('+(w.feld==='von'?'Seit':'Bis')+'): '+w.text+(w.vorschlag?' Vorschlag: '+w.vorschlag:''))}).join('<br>')+' <button id="btnFix" style="margin-left:8px">Jetzt korrigieren</button></div>';
  if(editMode){h+=editForm(d)}else{
    h+='<div class="cfPanel"><h2>Stammdaten</h2><div class="cfDl">'+dl('Name',d.pflege_name)+dl('Kasse',d.pflege_kasse)+dl('Anschrift',d.pflege_anschrift)+dl('Vers.-Nr.',d.pflege_kvnr)+dl('Geburtsdatum',d.pflege_geburtsdatum)+dl('Telefon',d.pflege_telefon)+'</div></div>';
    h+='<div class="cfPanel"><h2>Pflegegrade</h2>'+pgTabelle(d)+'</div>';
    h+='<div class="cfPanel"><h2>Verhinderungspflege</h2>'+vpTabelle(d)+'</div>';
    if(d.person_name||d.person_anschrift)h+='<div class="cfPanel"><h2>Bevollmächtigte Person / Ansprechpartner</h2><div class="cfDl">'+dl('Name',d.person_name)+dl('Anschrift',d.person_anschrift)+dl('Geburtsdatum',d.person_geburtsdatum)+dl('Verhältnis',d.person_verhaeltnis)+'</div></div>';
    helperPrefixe(d).forEach(function(n){var p=n===1?'hilfe':'hilfe'+n;h+='<div class="cfPanel"><h2>'+(n===1?'Nachbarschaftshilfe':n+'. Nachbarschaftshilfe')+'</h2><div class="cfDl">'+dl('Name',d[p+'_name'])+dl('Anschrift',d[p+'_anschrift'])+dl('Geburtsdatum',d[p+'_geburtsdatum'])+dl('Telefon',d[p+'_telefon'])+'</div></div>'});
    h+='<div class="cfPanel" id="pnlCalc"><div class="cfHead"><h2>Berechnung / Nachweis</h2></div>'+
      '<p class="mini">Zukünftig laufend möglich sowie – falls gewünscht – rückwirkend beantragbar, basierend auf den gespeicherten Pflegegrad-Phasen.</p>'+
      '<div class="actions" style="margin:8px 0"><label style="display:flex;align-items:center"><input type="checkbox" id="optRueck">Rückwirkend beantragen</label><label style="display:flex;align-items:center"><input type="checkbox" id="optPar" checked>Rechtsgrundlagen (§) anzeigen</label></div>'+
      '<div class="actions"><button class="primaryBtn" id="btnNach">Berechnung anzeigen</button><button id="btnNachPrint" class="hidden">Nachweis drucken</button></div><div id="resNach" style="margin-top:10px"></div></div>';
    var ab=abzugAnzeige!=null?abzugAnzeige:String(d.abzug_prozent||'40');
    h+='<div class="cfPanel kf" id="pnlAus"><div class="cfHead"><h2>Auswertung mit Abzug</h2><div class="actions"><button class="primaryBtn" id="btnAusPrint">Berechnung drucken / als PDF</button></div></div>'+
      '<div class="kfAbz" style="margin-bottom:6px"><span>Abzug</span><button type="button" class="kfAbzBtn" data-d="-5" title="5 % weniger">&minus;</button><input id="abzIn" value="'+esc(ab)+'" inputmode="decimal"><span>%</span><button type="button" class="kfAbzBtn" data-d="5" title="5 % mehr">+</button></div>'+
      '<div id="resAus"></div></div>';
    h+='<div class="cfPanel"><h2>Notizen</h2><div id="notesList"><div class="empty">Lade …</div></div><textarea class="cfInput" id="noteText" rows="3" placeholder="z. B. Kunde bittet um Rückruf wegen …" style="margin-top:8px"></textarea><div class="actions" style="margin-top:8px"><button class="primaryBtn" id="noteBtn">Notiz speichern</button></div></div>';
  }
  $('detail').innerHTML=h;bindDetail();
}
function editForm(d){
  var pg=CFForm.pflegegradHtml(d);
  return '<div class="cfPanel kf" id="kfRoot"><div class="wizardSteps"><span data-jump="e1">1 Person</span><span data-jump="e2">2 Pflegegrad</span><span data-jump="e3">3 Pflegeperson</span><span data-jump="e5">4 Entlastung</span><span data-jump="e6">5 Verhinderungspflege</span><span data-jump="e9">6 Berechnung</span></div>'+
    '<h3 class="kfH" id="e1">1. Pflegebedürftige Person</h3>'+CFForm.personHtml(d,{nameFix:true})+
    '<h3 class="kfH" id="e2">2. Pflegegrad</h3>'+pg.html+
    '<h3 class="kfH" id="e3">3. Pflegeperson <small>(gesetzliche Vertretung / bevollmächtigte Person, falls abweichend)</small></h3>'+CFForm.pflegepersonHtml(d)+
    '<h3 class="kfH" id="e5">4. Entlastungsbetrag (§ 45b SGB XI) <small>– je Jahr</small></h3>'+CFForm.entHtml(d,pg.form)+
    '<h3 class="kfH" id="e6">5. Verhinderungspflege / Kurzzeitpflege <small>– je Jahr</small></h3>'+CFForm.vpHtml(d)+
    '<h3 class="kfH" id="e9">6. Berechnung</h3>'+CFForm.abzugHtml(d)+
    '<div class="actions" style="margin-top:18px"><button class="primaryBtn" id="btnSave2">Speichern</button><button id="btnCancel2">Abbrechen</button></div></div>';
}
function zeigeAuswertung(){
  var d=cur.data,inp=$('abzIn');if(!inp)return;
  var r=CFC.berechne(d,inp.value);$('resAus').innerHTML=CFC.auswertungHtml(r);
}
function bindDetail(){
  var d=cur.data;
  if($('btnEdit'))$('btnEdit').onclick=function(){editMode=true;renderDetail();var root=$('kfRoot');if(CFC.pruefePhasen(d.pflegegrade).length)root.dataset.pgDirty='1';CFForm.bind(root);root.querySelectorAll('.wizardSteps [data-jump]').forEach(function(s){s.onclick=function(){var t=$(s.dataset.jump);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})}})};
  if($('btnFix'))$('btnFix').onclick=function(){$('btnEdit').click()};
  ['btnCancel','btnCancel2'].forEach(function(id){if($(id))$(id).onclick=function(){editMode=false;renderDetail();ladeNotizen()}});
  ['btnSave','btnSave2'].forEach(function(id){if($(id))$(id).onclick=speichern});
  if($('btnClickup'))$('btnClickup').onclick=clickupOeffnen;
  if($('btnFaEdit'))$('btnFaEdit').onclick=function(){startFernaufnahme(d.pflege_name||'',prefillPayload(d))};
  if(editMode)return;
  $('btnNach').onclick=function(){$('resNach').innerHTML=CFC.nachweisHtml(d,$('optRueck').checked,$('optPar').checked);$('btnNachPrint').classList.remove('hidden')};
  $('btnNachPrint').onclick=function(){CFC.drucken(CFC.nachweisHtml(d,$('optRueck').checked,$('optPar').checked),'Curafact Nachweis – '+(d.pflege_name||''))};
  $('abzIn').oninput=function(){abzugAnzeige=$('abzIn').value;zeigeAuswertung()};
  document.querySelectorAll('#pnlAus .kfAbzBtn').forEach(function(b){b.onclick=function(){var i=$('abzIn'),v=parseFloat(String(i.value).replace(',','.'))||0;v=Math.max(0,Math.min(100,v+Number(b.dataset.d)));i.value=String(v).replace('.',',');abzugAnzeige=i.value;zeigeAuswertung()}});
  $('btnAusPrint').onclick=function(){zeigeAuswertung();CFC.drucken($('resAus').innerHTML,'Curafact Berechnung – '+(d.pflege_name||''))};
  zeigeAuswertung();
  $('noteBtn').onclick=notizSpeichern;
}

/* ---------- Speichern ---------- */
async function speichern(){
  var root=$('kfRoot'),alt=cur.data,neu=CFForm.collect(root,alt),ch={};
  var erlaubt=['pflege_anschrift','pflege_geburtsdatum','pflege_telefon','pflege_kasse','pflege_kvnr','person_name','person_anschrift','person_geburtsdatum','person_verhaeltnis','pflegegrade','pflegegrad_seit_angabe','entlastung_jahre','verhinderungspflege','abzug_prozent','aufnahme_notizen'];
  var diff=CFForm.geaendert(alt,neu);if(!('abzug_prozent' in alt)&&diff.abzug_prozent==='40')delete diff.abzug_prozent;erlaubt.forEach(function(k){if(k in diff)ch[k]=diff[k]});
  if(!Object.keys(ch).length){alert('Es wurde nichts geändert.');return}
  var w=CFC.pruefePhasen(ch.pflegegrade||neu.pflegegrade);if(w.length&&!confirm('Ein Datum im Pflegegrad ist ungültig:\n'+w.map(function(x){return x.text}).join('\n')+'\n\nTrotzdem speichern?'))return;
  document.querySelectorAll('#btnSave,#btnSave2').forEach(function(b){b.disabled=true});
  var r=await CFAPI.call('web_customer_save',{file:cur.file,changes:ch});
  if(!r||!r.ok){alert((r&&r.message)||'Speichern fehlgeschlagen.');document.querySelectorAll('#btnSave,#btnSave2').forEach(function(b){b.disabled=false});return}
  editMode=false;await ladeKunden();await oeffneKunde(cur.file);
}

/* ---------- ClickUp, Notizen ---------- */
async function clickupOeffnen(){
  var b=$('btnClickup');b.disabled=true;var r=await CFAPI.call('clickup_ensure_task',{name:cur.data.pflege_name,kind:'kunde'});b.disabled=false;
  if(r&&r.ok&&r.task_id)window.open('https://app.clickup.com/t/'+encodeURIComponent(r.task_id),'_blank','noopener');else alert((r&&r.message)||'ClickUp-Aufgabe konnte nicht geöffnet werden.');
}
async function ladeNotizen(){
  if(editMode||!$('notesList'))return;
  var r=await CFAPI.call('notes_list',{customer_name:cur.data.pflege_name||''});
  var el=$('notesList');if(!el)return;
  var n=(r&&r.notes)||[];
  el.innerHTML=n.length?n.map(function(x){return '<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div class="mini">'+esc(new Date(x.created_at).toLocaleString('de-DE'))+' · '+esc(x.display_name||x.username||'')+'</div><div>'+esc(x.text).replace(/\n/g,'<br>')+'</div></div>'}).join(''):'<p class="mini">Noch keine Notizen.</p>';
}
async function notizSpeichern(){
  var t=$('noteText').value.trim();if(!t)return;
  $('noteBtn').disabled=true;var r=await CFAPI.call('notes_add',{customer_name:cur.data.pflege_name,text:t,kontext:'abrechnung'});$('noteBtn').disabled=false;
  if(r&&r.ok){$('noteText').value='';ladeNotizen()}else alert((r&&r.message)||'Notiz konnte nicht gespeichert werden.');
}

/* ---------- Fernaufnahme (Link / QR) – nur Abrechnung ---------- */
function toIso(v){var m=String(v||'').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''}
function helfer(d){return helperPrefixe(d).map(function(n){var p=n===1?'hilfe':'hilfe'+n;return {name:d[p+'_name']||'',anschrift:d[p+'_anschrift']||'',geburtsdatum:d[p+'_geburtsdatum']||'',telefon:d[p+'_telefon']||'',sig_dataurl:d[p+'_sig_dataurl']||''}})}
function prefillPayload(d){
  return {pflege_name:d.pflege_name||'',pflege_anschrift:d.pflege_anschrift||'',pflege_geburtsdatum:toIso(d.pflege_geburtsdatum),pflege_kvnr:d.pflege_kvnr||'',pflege_kasse:d.pflege_kasse||'',pflege_telefon:d.pflege_telefon||'',pflege_sig_dataurl:d.pflege_sig_dataurl||'',
    person_name:d.person_name||'',person_anschrift:d.person_anschrift||'',person_geburtsdatum:toIso(d.person_geburtsdatum),person_verhaeltnis:d.person_verhaeltnis||'',
    pflegegrade:(Array.isArray(d.pflegegrade)?d.pflegegrade:[]),entlastung_jahre:d.entlastung_jahre||{},verhinderungspflege:Array.isArray(d.verhinderungspflege)?d.verhinderungspflege:[],nachbarschaftshilfen:helfer(d)};
}
function faMeldung(t){var e=$('faMsg');if(!e){e=document.createElement('div');e.id='faMsg';e.className='note noteBad';$('faNewBtn').parentNode.insertBefore(e,$('faNewBtn'))}e.textContent=t;e.classList.toggle('hidden',!t)}
async function startFernaufnahme(label,customer){
  faMeldung('');
  var r;
  try{r=await CFAPI.call('intake_create',{label:label,customer:customer||null})}catch(e){faMeldung('Fernaufnahme: Verbindung fehlgeschlagen ('+e+').');return}
  if(!r||!r.ok){faMeldung('Fernaufnahme konnte nicht gestartet werden: '+((r&&(r.message||('Status '+r.http_status)))||'keine Antwort')+'.');return}
  try{ startFernaufnahmeZeigen(label,customer,r) }catch(e){faMeldung('Fernaufnahme: Anzeige fehlgeschlagen ('+e+').')}
}
function startFernaufnahmeZeigen(label,customer,r){
  var base=location.href.replace(/[?#].*$/,'').replace(/[^\/]*$/,'');
  var url=base+'intake.html?s='+encodeURIComponent(r.session)+'&l='+encodeURIComponent(label||'Aufnahme');
  $('mTitle').textContent=customer?'Fernaufnahme – Änderungen':'Fernaufnahme – neuer Kunde';
  $('mLabel').textContent=label?('Für: '+label+' – Angaben werden in Studio diesem Kunden zugeordnet.'):'Link/QR-Code an den Kunden schicken. Die Angaben erscheinen danach in Studio.';
  $('mUrl').textContent=url;$('mQr').innerHTML='';
  try{new QRCode($('mQr'),{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}catch(e){}
  $('mOpen').onclick=function(){window.open(url,'_blank','noopener')};
  $('mCopy').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(url).then(function(){$('mCopy').textContent='Kopiert ✓'})};
  $('mShare').onclick=function(){if(navigator.share)navigator.share({title:'Curafact Aufnahme',url:url});else $('mCopy').click()};
  $('modal').classList.remove('hidden');
}
$('mClose').onclick=function(){$('modal').classList.add('hidden')};
$('faNewBtn').onclick=function(){startFernaufnahme('',null)};

/* ---------- Start ---------- */
(function(){
  try{var u=localStorage.getItem('curafact_web_user');if(u)$('loginUser').value=u}catch(e){}
  if(CFAPI.load())starteApp();else zeigeLogin('');
})();
</script></body></html>
