<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curafact – Kunden</title><link rel="stylesheet" href="cf.css?v=15"></head><body>

<div id="loginBox" class="loginWrap hidden"><div class="cfPanel">
  <img src="logo.png" alt="Curafact">
  <h2 style="border:0;margin-bottom:4px">Anmelden</h2>
  <p class="mini" style="margin-top:0">Benutzername und der 6-stellige Code aus der Authenticator-App.</p>
  <label for="loginUser">Benutzername</label><input class="cfInput" id="loginUser" autocomplete="username" placeholder="z. B. onder">
  <label for="loginCode">Code</label><input class="cfInput" id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" style="letter-spacing:6px;text-align:center;font-size:20px">
  <div class="err" id="loginErr"></div>
  <button class="primaryBtn" id="loginBtn" style="width:100%;margin-top:8px">Anmelden</button>
</div></div>

<div id="appBox" class="cfApp hidden">
  <aside class="cfSide"><div id="sideNav"></div><div class="who">Angemeldet als <strong id="whoName"></strong><br><button id="logoutBtn" style="margin-top:8px;width:100%">Abmelden</button></div></aside>
  <aside class="cfRail">
    <div class="railHead"><h2>Kunden</h2><span class="cfCount" id="custCount">0</span></div>
    <input class="cfSearch" id="custSearch" placeholder="Kunde suchen…">
    <div class="cfList" id="custList"><div class="empty">Lade Kunden …</div></div>
  </aside>
  <main class="cfMain" id="detail"><div class="empty">Bitte links einen Kunden auswählen.</div></main>
  <main class="cfMain hidden" id="viewRechner" style="max-width:1100px;flex:1"></main>
  <main class="cfMain hidden" id="viewAufn" style="max-width:1100px;flex:1"></main>
</div>

<div id="modal" class="modalOverlay hidden"><div class="modalBox">
  <h3 id="mTitle">Fernaufnahme</h3><p class="mini" id="mLabel"></p><div id="mQr" style="text-align:center;margin:10px 0"></div>
  <p class="mini" id="mUrl" style="word-break:break-all"></p>
  <div class="actions"><button id="mOpen">Link öffnen</button><button id="mShare">Teilen</button><button id="mCopy">Link kopieren</button><button id="mClose">Schließen</button></div>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="cf-aufnahme-druck.js?v=1"></script><script src="kfc.js"></script><script src="cf-calc.js?v=15"></script><script src="cf-form.js?v=15"></script><script src="cf-sig.js?v=1"></script><script src="cf-api.js?v=15"></script><script src="cf-rechner.js?v=15"></script>
<script>
function $(id){return document.getElementById(id)}
var esc=CFC.esc;
var customers=[],cur=null,editMode=false,abzugAnzeige=null;
document.getElementById('sideNav').innerHTML=cfSide('kunden');
var rechnerGemountet=false;
function ansichtVon(href){return href==='rechner.html'?'rechner':(String(href).indexOf('#aufnahmen')>=0?'aufnahmen':'kunden')}
function zeigeAnsicht(v){
  var k=(v==='kunden');
  document.querySelector('.cfRail').classList.toggle('hidden',!k);$('detail').classList.toggle('hidden',!k);$('viewRechner').classList.toggle('hidden',v!=='rechner');$('viewAufn').classList.toggle('hidden',v!=='aufnahmen');
  document.querySelectorAll('#sideNav .cfNav a').forEach(function(a){a.classList.toggle('active',ansichtVon(a.getAttribute('href'))===v)});
  if(v==='rechner'&&!rechnerGemountet){rechnerGemountet=true;CFRechner.mount($('viewRechner'))}
  if(v==='aufnahmen')ladeAufnahmen();
}
(function(){var nav=document.querySelector('#sideNav .cfNav'),a=document.createElement('a');a.href='index.html#aufnahmen';a.textContent='Aufnahmen';nav.insertBefore(a,nav.children[1]||null)})();
document.querySelectorAll('#sideNav .cfNav a').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();zeigeAnsicht(ansichtVon(a.getAttribute('href')))})});
(function(){var nav=document.querySelector('#sideNav .cfNav'),b=document.createElement('button');b.id='faNewBtn';b.type='button';b.textContent='+ Neuer Kunde (Link / QR)';nav.insertBefore(b,nav.children[1]||null);var q=document.createElement('button');q.id='faPdfBtn';q.type='button';q.textContent='Aufnahmebogen (PDF)';q.title='Leeren Neukunden-Aufnahmebogen zum Ausdrucken öffnen';q.onclick=function(){window.open('Neukunden-Aufnahmebogen.pdf','_blank')};nav.insertBefore(q,b.nextSibling)})();

/* ---------- Anmeldung ---------- */
function zeigeLogin(msg){$('appBox').classList.add('hidden');$('loginBox').classList.remove('hidden');$('loginErr').textContent=msg||'';$('loginCode').value='';setTimeout(function(){($('loginUser').value?$('loginCode'):$('loginUser')).focus()},50)}
CFAPI.onExpired=function(){zeigeLogin('Sitzung abgelaufen. Bitte erneut anmelden.')};
async function doLogin(){
  $('loginErr').textContent='';var u=$('loginUser').value.trim(),c=$('loginCode').value.trim();
  if(!u||!c){$('loginErr').textContent='Bitte Benutzername und Code eingeben.';return}
  $('loginBtn').disabled=true;var r=await CFAPI.login(u,c);$('loginBtn').disabled=false;
  if(r&&r.ok){try{localStorage.setItem('curafact_web_user',u)}catch(e){}starteApp()}else $('loginErr').textContent=(r&&r.message)||'Anmeldung fehlgeschlagen.';
}
$('loginBtn').onclick=doLogin;$('loginCode').onkeydown=function(e){if(e.key==='Enter')doLogin()};
$('logoutBtn').onclick=async function(){await CFAPI.logout();cur=null;zeigeLogin('')};
function starteApp(){
  $('loginBox').classList.add('hidden');$('appBox').classList.remove('hidden');
  $('whoName').textContent=(CFAPI.user&&CFAPI.user.display_name)||'';
  ladeKunden();
  if(location.hash==='#rechner')zeigeAnsicht('rechner');else if(location.hash==='#aufnahmen')zeigeAnsicht('aufnahmen');
}

/* ---------- Kundenliste ---------- */
async function ladeKunden(){
  var r=await CFAPI.call('web_customers');
  if(!r||!r.ok){if(!(r&&r.auth_required))$('custList').innerHTML='<div class="empty">'+esc((r&&r.message)||'Kunden konnten nicht geladen werden.')+'</div>';return}
  customers=r.customers||[];renderListe();
}
function renderListe(){
  var q=$('custSearch').value.trim().toLowerCase(),list=customers.filter(function(c){return !q||String(c.name||'').toLowerCase().indexOf(q)>=0});
  $('custCount').textContent=list.length;
  var dup={};customers.forEach(function(c){dup[c.name]=(dup[c.name]||0)+1});
  $('custList').innerHTML=list.length?list.map(function(c){return '<button class="cfCust'+(cur&&cur.file===c.file?' sel':'')+'" data-f="'+esc(c.file)+'"><strong>'+esc(c.name)+'</strong><small>'+esc([c.kasse,c.pflegegrad,c.beratung?'Beratung':''].filter(Boolean).join(' · '))+(dup[c.name]>1?' · Datei: '+esc(c.file):'')+(c.pending_edit?' · <b style="color:#8a5a00">Web-Änderung</b>':'')+'</small></button>'}).join(''):'<div class="empty">Keine Kunden gefunden.</div>';
}
$('custSearch').oninput=renderListe;
$('custList').onclick=function(e){var b=e.target.closest('.cfCust');if(b)oeffneKunde(b.dataset.f)};

async function oeffneKunde(file){
  editMode=false;abzugAnzeige=null;
  $('detail').innerHTML='<div class="empty">Lade …</div>';
  var r=await CFAPI.call('web_customer',{file:file});
  if(!r||!r.ok){$('detail').innerHTML='<div class="empty">'+esc((r&&r.message)||'Kunde konnte nicht geladen werden.')+'</div>';return}
  cur={file:file,data:r.customer,pending:r.pending||0};
  renderListe();renderDetail();ladeNotizen();
}

/* ---------- Aufnahmen (alle Fernaufnahmen und Unterschriften, ohne Abholen) ---------- */
function aufnStatus(x){
  if(x.imported_file)return {t:'Übernommen',c:'ok'};
  if(x.is_edit)return {t:x.main_received?(x.draft?'Änderung – Entwurf':'Änderung eingegangen'):'Änderung – Link offen',c:x.main_received&&!x.draft?'wait':'mute'};
  if(!x.main_received)return {t:'Link offen',c:'mute'};
  if(x.draft)return {t:'Entwurf (noch nicht abgeschickt)',c:'mute'};
  return {t:'Eingegangen – wird in Studio übernommen',c:'wait'};
}
function aufnDatum(x){var t=x.submitted_at?Date.parse(x.submitted_at):(x.created_at?x.created_at*1000:0);return t?new Date(t).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}
async function ladeAufnahmen(){
  var box=$('viewAufn');box.innerHTML='<div class="cfPanel"><h2>Aufnahmen</h2><div class="empty">Lade …</div></div>';
  var r=await CFAPI.call('intake_list'),r2=await CFAPI.call('signature_list');
  if(!r||!r.ok){box.innerHTML='<div class="cfPanel"><h2>Aufnahmen</h2><div class="empty">'+esc((r&&r.message)||'Aufnahmen konnten nicht geladen werden.')+'</div></div>';return}
  var list=(r.sessions||[]).filter(function(x){return !x.nur_mitarbeiter});
  var h='<div class="cfPanel"><div class="cfHead"><h2>Eingegangene Aufnahmen</h2><div class="actions"><button id="aufnReload">Aktualisieren</button></div></div>'+
    '<p class="mini">Alle Fernaufnahmen per Link / QR, auch Entwürfe. Studio übernimmt neue Aufnahmen automatisch als Kunde (Hauptakte bleibt auf dem Mac); sie bleiben hier sichtbar.</p>';
  h+=list.length?'<div class="tablewrap"><table class="cfTable"><thead><tr><th>Name</th><th>Datum</th><th>Status</th><th>Kasse</th><th>Kunde</th><th></th></tr></thead><tbody>'+list.map(function(x){
    var st=aufnStatus(x),dk=x.imported_file?x.imported_file.replace(/\.json$/,'').replace(/_/g,' '):'';
    return '<tr><td><strong>'+esc(x.name||x.label||'—')+'</strong>'+(x.geburtsdatum?'<br><span class="mini">'+esc(x.geburtsdatum)+'</span>':'')+'</td><td>'+esc(aufnDatum(x))+'</td><td>'+esc(st.t)+'</td><td>'+esc(x.kasse||'')+'</td><td>'+(x.imported_file?'<a href="#" class="aufnOpen" data-f="'+esc(x.imported_file)+'">'+esc(dk)+'</a>':'—')+(x.imported_kunden_id?'<br><span class="mini">ID '+esc(x.imported_kunden_id.slice(0,8))+'</span>':'')+'</td>'+
      '<td style="white-space:nowrap"><button class="aufnView" data-s="'+esc(x.session)+'"'+(x.main_received?'':' disabled')+'>Ansehen</button> <button class="aufnDel" data-s="'+esc(x.session)+'" data-n="'+esc(x.name||'')+'" data-i="'+(x.imported_file?'1':'')+'">Löschen</button></td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">Keine Aufnahmen vorhanden.</div>';
  h+='<div id="aufnDetail"></div></div>';
  var sg=(r2&&r2.ok&&r2.signatures)||[];
  h+='<div class="cfPanel"><div class="cfHead"><h2>Unterschriften per Link</h2></div><p class="mini">Jede Unterschrift hat eine Kennung und ist der Kundenakte (Kunden-ID) zugeordnet, für die der Link erzeugt wurde. Sie bleibt auf dem Server, bis sie in Studio bestätigt wurde.</p>';
  h+=sg.length?'<div class="tablewrap"><table class="cfTable"><thead><tr><th>Angefordert</th><th>Für</th><th>Rolle / Zweck</th><th>Status</th><th>Kennung</th></tr></thead><tbody>'+sg.map(function(x){
    return '<tr><td>'+esc(x.created_at?new Date(x.created_at).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—')+'</td><td>'+esc(x.customer_name||x.customer_file||'— (keiner Akte zugeordnet)')+(x.kunden_id?'<br><span class="mini">Kunden-ID '+esc(String(x.kunden_id).slice(0,8))+'</span>':'')+'</td><td>'+esc([x.rolle,x.label].filter(Boolean).join(' · ')||'—')+'</td><td>'+(x.received?(x.fetched_at?'Eingegangen, in Studio abgeholt':'Eingegangen'):'Link offen')+'</td><td class="mini">'+esc(String(x.token).slice(0,8))+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="empty">Keine Unterschriften vorhanden.</div>';
  h+='</div>';
  box.innerHTML=h;
  $('aufnReload').onclick=ladeAufnahmen;
  box.querySelectorAll('.aufnOpen').forEach(function(a){a.onclick=function(e){e.preventDefault();zeigeAnsicht('kunden');oeffneKunde(a.dataset.f)}});
  box.querySelectorAll('.aufnView').forEach(function(b){b.onclick=function(){aufnAnsehen(b.dataset.s)}});
  box.querySelectorAll('.aufnDel').forEach(function(b){b.onclick=async function(){
    var wer=b.dataset.n||'diese Aufnahme';
    if(!confirm(wer+': Aufnahme wirklich löschen?'+(b.dataset.i?'\n\nDie Kundenakte in Studio bleibt unverändert.':'\n\nDie Angaben wurden noch nicht in Studio übernommen und gehen verloren.')))return;
    var r=await CFAPI.call('intake_delete',{session:b.dataset.s});if(r&&r.ok)ladeAufnahmen();else alert((r&&r.message)||'Löschen fehlgeschlagen.');
  }});
}
async function aufnAnsehen(session){
  var el=$('aufnDetail');el.innerHTML='<div class="empty">Lade …</div>';
  var r=await CFAPI.call('intake_get',{session:session});
  if(!r||!r.ok||!r.main){el.innerHTML='<div class="empty">Keine Angaben vorhanden.</div>';return}
  var d=r.main.data||{},pg=(Array.isArray(d.pflegegrade)?d.pflegegrade:[]).map(function(x){return 'PG '+x.stufe+' ab '+(x.von||'?')+(x.bis?' bis '+x.bis:'')}).join(', ');
  var hs=(d.nachbarschaftshilfen||[]).map(function(x){return (x.hilfe_name||'—')+(x.hilfe_sig_dataurl?' (unterschrieben)':'')}).join(', ');
  var rows=(r.helpers||[]);
  el.innerHTML='<h3 style="margin:16px 0 6px">'+esc(d.pflege_name||'Aufnahme')+(r.main.draft?' <span class="mini">(Entwurf)</span>':'')+'</h3><div class="cfDl">'+dl('Geburtsdatum',d.pflege_geburtsdatum)+dl('Anschrift',d.pflege_anschrift)+dl('Telefon',d.pflege_telefon)+dl('Kasse',d.pflege_kasse)+dl('Vers.-Nr.',d.pflege_kvnr)+dl('Pflegegrade',pg)+dl('Pflegeperson',d.person_name)+dl('Nachbarschaftshilfe',hs||rows.map(function(x){return (x.data&&x.data.hilfe_name)||''}).filter(Boolean).join(', '))+dl('Unterschrift Kunde',r.main.dataurl?'vorhanden':'')+dl('Anmerkungen',d.anmerkungen)+'</div>';
}

/* ---------- Detailansicht ---------- */
function dl(label,val){return '<div><label>'+label+'</label><span>'+(val?esc(val):'—')+'</span></div>'}
function pgTabelle(d){
  var rows=Array.isArray(d.pflegegrade)?d.pflegegrade:[];
  if(!rows.length)return '<p class="mini">Keine Pflegegrade erfasst.</p>';
  function cell(v){var s=String(v==null?'':v).trim();if(!s)return '<td>—</td>';return CFC.parseDE(s)?'<td>'+esc(s)+'</td>':'<td class="bad" title="Kein gültiges Datum – bitte korrigieren">'+esc(s)+' ⚠</td>'}
  return '<div class="tablewrap"><table class="cfTable"><thead><tr><th>Stufe</th><th>Seit</th><th>Bis</th><th>Fortlaufend</th><th>Entlastung genommen</th></tr></thead><tbody>'+
    rows.map(function(p){return '<tr><td>PG'+esc(p.stufe)+'</td>'+cell(p.von)+cell(p.bis)+'<td>'+(p.fortlaufend?'Ja':'Nein')+'</td><td>'+(p.entlastung_genommen?'Ja':'Nein')+'</td></tr>'}).join('')+'</tbody></table></div>';
}
function vpTabelle(d){
  var rows=Array.isArray(d.verhinderungspflege)?d.verhinderungspflege:[];
  if(!rows.length)return '<p class="mini">Keine Verhinderungspflege erfasst.</p>';
  return '<div class="tablewrap"><table class="cfTable"><thead><tr><th>Jahr</th><th>Genommen</th><th>Betrag / Rest</th><th>Von</th><th>Bis</th></tr></thead><tbody>'+
    rows.map(function(v){return '<tr><td>'+esc(v.jahr)+'</td><td>'+(v.genommen?'Ja':'Nein')+'</td><td>'+esc(v.betrag||'')+'</td><td>'+esc(v.start||'')+'</td><td>'+esc(v.ende||'')+'</td></tr>'}).join('')+'</tbody></table></div>';
}
function helperPrefixe(d){var n=new Set();Object.keys(d).forEach(function(k){var m=k.match(/^hilfe(\d*)_/);if(m)n.add(m[1]===''?1:+m[1])});return Array.from(n).sort(function(a,b){return a-b})}
function renderDetail(){
  var d=cur.data,warn=CFC.pruefePhasen(d.pflegegrade);
  var h='<div class="cfTop"><div><h1>'+esc(d.pflege_name||'Kunde')+'</h1><p>'+esc([d.pflege_kasse,d.pflege_kvnr].filter(Boolean).join(' · '))+'</p>'+(d.kunden_id?'<p class="mini" title="'+esc(d.kunden_id)+'">Kunden-ID '+esc(String(d.kunden_id).slice(0,8))+'</p>':'')+'</div><div class="actions">'+
    (editMode?'<button class="primaryBtn" id="btnSave">Speichern</button><button id="btnCancel">Abbrechen</button>':'<button class="primaryBtn" id="btnEdit">Bearbeiten</button><button id="btnClickup">In ClickUp öffnen</button><button id="btnFaEdit">Fernaufnahme (Änderungen)</button><button id="btnAufnDruck" title="Ausgefüllten Aufnahmebogen drucken / als PDF sichern">Aufnahmebogen drucken</button>')+'</div></div>';
  if(cur.pending||d._portal_edit)h+='<div class="note">Im Web geändert'+(d._portal_edit?' von '+esc(d._portal_edit.by||'')+' am '+esc(new Date(d._portal_edit.at).toLocaleString('de-DE')):'')+(cur.pending?' – '+cur.pending+' Änderung(en) noch nicht in Studio übernommen (Studio zeigt sie beim nächsten Start an).':'')+'</div>';
  if(warn.length&&!editMode)h+='<div class="note noteBad"><b>Datum prüfen:</b> '+warn.map(function(w){return esc('Pflegegrad-Zeile '+(w.zeile+1)+' ('+(w.feld==='von'?'Seit':'Bis')+'): '+w.text+(w.vorschlag?' Vorschlag: '+w.vorschlag:''))}).join('<br>')+' <button id="btnFix" style="margin-left:8px">Jetzt korrigieren</button></div>';
  if(editMode){h+=editForm(d)}else{
    h+='<div class="cfPanel"><h2>Stammdaten</h2><div class="cfDl">'+dl('Name',d.pflege_name)+dl('Kasse',d.pflege_kasse)+dl('Anschrift',d.pflege_anschrift)+dl('Vers.-Nr.',d.pflege_kvnr)+dl('Geburtsdatum',d.pflege_geburtsdatum)+dl('Telefon',d.pflege_telefon)+dl('Pflegeberatung',d.pflegeberatung_kunde?'Ja (§ 37 Abs. 3)':'Nein')+'</div></div>';
    h+='<div class="cfPanel"><h2>Pflegegrade</h2>'+pgTabelle(d)+'</div>';
    h+='<div class="cfPanel"><h2>Verhinderungspflege</h2>'+vpTabelle(d)+'</div>';
    if(d.person_name||d.person_anschrift)h+='<div class="cfPanel"><h2>Bevollmächtigte Person / Ansprechpartner</h2><div class="cfDl">'+dl('Name',d.person_name)+dl('Anschrift',d.person_anschrift)+dl('Geburtsdatum',d.person_geburtsdatum)+dl('Verhältnis',d.person_verhaeltnis)+'</div></div>';
    helperPrefixe(d).forEach(function(n){var p=n===1?'hilfe':'hilfe'+n;h+='<div class="cfPanel"><h2>'+(n===1?'Nachbarschaftshilfe':n+'. Nachbarschaftshilfe')+'</h2><div class="cfDl">'+dl('Name',d[p+'_name'])+dl('Anschrift',d[p+'_anschrift'])+dl('Geburtsdatum',d[p+'_geburtsdatum'])+dl('Telefon',d[p+'_telefon'])+'</div>'+(d[p+'_sig_dataurl']?'<img class="sigPreviewImg" alt="Unterschrift" src="'+esc(d[p+'_sig_dataurl'])+'">':'<p class="mini">Noch keine Unterschrift.</p>')+'</div>'});
    h+='<div class="cfPanel" id="pnlCalc"><div class="cfHead"><h2>Berechnung / Nachweis</h2></div>'+
      '<p class="mini">Zukünftig laufend möglich sowie – falls gewünscht – rückwirkend beantragbar, basierend auf den gespeicherten Pflegegrad-Phasen.</p>'+
      '<div class="actions" style="margin:8px 0"><label style="display:flex;align-items:center"><input type="checkbox" id="optRueck">Rückwirkend beantragen</label><label style="display:flex;align-items:center"><input type="checkbox" id="optPar" checked>Rechtsgrundlagen (§) anzeigen</label></div>'+
      '<div class="actions"><button class="primaryBtn" id="btnNach">Berechnung anzeigen</button><button id="btnNachPrint" class="hidden">Nachweis drucken</button></div><div id="resNach" style="margin-top:10px"></div></div>';
    var ab=abzugAnzeige!=null?abzugAnzeige:String(d.abzug_prozent||'40');
    h+='<div class="cfPanel kf" id="pnlAus"><div class="cfHead"><h2>Auswertung mit Abzug</h2><div class="actions"><button class="primaryBtn" id="btnAusPrint">Berechnung drucken / als PDF</button></div></div>'+
      '<div class="kfAbz" style="margin-bottom:6px"><span>Abzug</span><button type="button" class="kfAbzBtn" data-d="-5" title="5 % weniger">&minus;</button><input id="abzIn" value="'+esc(ab)+'" inputmode="decimal"><span>%</span><button type="button" class="kfAbzBtn" data-d="5" title="5 % mehr">+</button></div>'+
      '<div id="resAus"></div></div>';
    h+='<div class="cfPanel"><h2>Notizen</h2><div id="notesList"><div class="empty">Lade …</div></div><textarea class="cfInput" id="noteText" rows="3" placeholder="z. B. Kunde bittet um Rückruf wegen …" style="margin-top:8px"></textarea><div class="actions" style="margin-top:8px"><button class="primaryBtn" id="noteBtn">Notiz speichern</button></div></div>';
  }
  $('detail').innerHTML=h;bindDetail();
}
/* ---------- Nachbarschaftshilfe bearbeiten (Felder hilfe_*, hilfe2_* … wie in der Kundenakte) ---------- */
var HELFER_FELDER=['name','anschrift','geburtsdatum','telefon','sig_dataurl'],HELFER_MAX=9,editSigs={};
function helferPrefix(n){return n===1?'hilfe':'hilfe'+n}
function helferSlotHtml(n,pre,kannEntfernen){
  pre=pre||{};
  return '<div class="helperSlot" data-n="'+n+'"><div class="slotHead" style="display:flex;justify-content:space-between;align-items:center"><strong>'+n+'. Nachbarschaftshilfe</strong>'+(kannEntfernen?'<button type="button" class="kfX hRemove" title="Diese Nachbarschaftshilfe entfernen">&times;</button>':'')+'</div>'+
    '<div class="kfGrid"><div class="kfF" style="grid-column:span 12"><label>Name, Vorname</label><input id="h'+n+'_name" value="'+esc(pre.name||'')+'"></div>'+
    '<div class="kfF" style="grid-column:span 12"><label>Anschrift (Straße, PLZ, Ort)</label><input id="h'+n+'_anschrift" value="'+esc(pre.anschrift||'')+'"></div>'+
    '<div class="kfF" style="grid-column:span 6"><label>Geburtsdatum (TT.MM.JJJJ)</label><input id="h'+n+'_geburtsdatum" value="'+esc(pre.geburtsdatum||'')+'"></div>'+
    '<div class="kfF" style="grid-column:span 6"><label>Telefon</label><input id="h'+n+'_telefon" type="tel" value="'+esc(pre.telefon||'')+'"></div></div>'+
    '<div class="sigArea" style="margin-top:12px"><label style="font-size:12px;font-weight:700;color:#4f6a85">Unterschrift (mit Finger oder Stift im Feld, oder Datei wählen)</label>'+
    '<div class="sigFileRow" style="margin-top:6px"><button type="button" id="sigfilebtn_h'+n+'">Datei wählen</button><input type="file" accept="image/*" id="sigfile_h'+n+'" class="hidden"><span class="fileStatusStyle" id="sigfilestatus_h'+n+'">Keine Datei ausgewählt</span></div>'+
    '<img id="sigpreview_h'+n+'" class="sigPreviewImg hidden" alt="Unterschrift"><canvas id="sig_h'+n+'"></canvas><div class="sigbar"><button type="button" id="sigclear_h'+n+'">Löschen</button></div></div></div>';
}
function helferEditHtml(d){
  var vorh=helperPrefixe(d).filter(function(n){var p=helferPrefix(n);return d[p+'_name']||d[p+'_anschrift']||d[p+'_sig_dataurl']||d[p+'_geburtsdatum']||d[p+'_telefon']});
  if(!vorh.length)vorh=[1];
  var h='<div id="helperSlots">'+vorh.map(function(n){var p=helferPrefix(n);return helferSlotHtml(n,{name:d[p+'_name'],anschrift:d[p+'_anschrift'],geburtsdatum:d[p+'_geburtsdatum'],telefon:d[p+'_telefon']},n>1)}).join('')+'</div>';
  return h+'<div class="actions" style="margin-top:10px"><button type="button" id="hAdd">+ weitere Nachbarschaftshilfe</button></div><p class="mini">Wird mit „Speichern“ gesichert. Studio übernimmt es beim nächsten Start nach Bestätigung (Button „Web-Änderungen“).</p>';
}
function helferSlotBinden(slot,sigAlt){
  var n=+slot.dataset.n;editSigs[n]=setupSigInput('h'+n);
  if(sigAlt)editSigs[n].setDataUrl(sigAlt);
  var rm=slot.querySelector('.hRemove');if(rm)rm.onclick=function(){if(!confirm('Diese Nachbarschaftshilfe samt Unterschrift entfernen? Gilt erst nach „Speichern“.'))return;slot.dataset.removed='1';slot.style.display='none'};
}
function helferEditBinden(d){
  document.querySelectorAll('#helperSlots .helperSlot').forEach(function(slot){helferSlotBinden(slot,d[helferPrefix(+slot.dataset.n)+'_sig_dataurl'])});
  var add=$('hAdd');if(!add)return;
  add.onclick=function(){
    var slots=document.querySelectorAll('#helperSlots .helperSlot'),max=0;slots.forEach(function(s){max=Math.max(max,+s.dataset.n)});
    if(max>=HELFER_MAX){alert('Mehr als '+HELFER_MAX+' Nachbarschaftshilfen sind nicht vorgesehen.');return}
    var holder=document.createElement('div');holder.innerHTML=helferSlotHtml(max+1,{},true);var slot=holder.firstChild;
    $('helperSlots').appendChild(slot);helferSlotBinden(slot,'');slot.scrollIntoView({behavior:'smooth',block:'center'});
  };
}
/* Formularwerte der Nachbarschaftshilfen in die Kundendaten schreiben (neue leere Felder werden nicht angelegt) */
function helferEinsammeln(neu,alt){
  document.querySelectorAll('#helperSlots .helperSlot').forEach(function(slot){
    var n=+slot.dataset.n,p=helferPrefix(n),weg=slot.dataset.removed==='1',sig=editSigs[n];
    HELFER_FELDER.forEach(function(f){
      var v;
      if(weg)v='';
      else if(f==='sig_dataurl')v=sig?sig.getDataUrl():'';
      else{var e=$('h'+n+'_'+f);v=e?String(e.value||'').trim():''}
      if(v!==''||(p+'_'+f) in alt)neu[p+'_'+f]=v;
    });
  });
}
function editForm(d){
  var pg=CFForm.pflegegradHtml(d);
  return '<form class="cfPanel kf" id="kfRoot" onsubmit="return false"><div class="wizardSteps"><span data-jump="e1">1 Person</span><span data-jump="e2">2 Pflegegrad</span><span data-jump="e3">3 Pflegeperson</span><span data-jump="e4">4 Nachbarschaftshilfe</span><span data-jump="e5">5 Entlastung</span><span data-jump="e6">6 Verhinderungspflege</span><span data-jump="e9">7 Berechnung</span></div>'+
    '<h3 class="kfH" id="e1">1. Pflegebedürftige Person</h3>'+CFForm.personHtml(d,{nameFix:true})+
    '<div class="kfF" style="margin:4px 0 8px"><label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--text)"><input type="checkbox" id="f_beratung"'+(d.pflegeberatung_kunde?' checked':'')+' style="width:auto"> Auch Pflegeberatung (§ 37 Abs. 3)</label><p class="mini">Markiert die Person als Beratungskunde. Studio übernimmt das beim nächsten Start und legt die Akte für das UG-Portal im Ordner Portal_Eingang ab.</p></div>'+
    '<h3 class="kfH" id="e2">2. Pflegegrad</h3>'+pg.html+
    '<h3 class="kfH" id="e3">3. Pflegeperson <small>(gesetzliche Vertretung / bevollmächtigte Person, falls abweichend)</small></h3>'+CFForm.pflegepersonHtml(d)+
    '<h3 class="kfH" id="e4">4. Nachbarschaftshilfe <small>(Name, Anschrift, Unterschrift)</small></h3>'+helferEditHtml(d)+
    '<h3 class="kfH" id="e5">5. Entlastungsbetrag (§ 45b SGB XI) <small>– je Jahr</small></h3>'+CFForm.entHtml(d,pg.form)+
    '<h3 class="kfH" id="e6">6. Verhinderungspflege / Kurzzeitpflege <small>– je Jahr</small></h3>'+CFForm.vpHtml(d)+
    '<h3 class="kfH" id="e9">7. Berechnung</h3>'+CFForm.abzugHtml(d)+
    '<div class="actions" style="margin-top:18px"><button type="button" class="primaryBtn" id="btnSave2">Speichern</button><button type="button" id="btnCancel2">Abbrechen</button></div></form>';
}
function zeigeAuswertung(){
  var d=cur.data,inp=$('abzIn');if(!inp)return;
  var r=CFC.berechne(d,inp.value);$('resAus').innerHTML=CFC.auswertungHtml(r);
}
function bindDetail(){
  var d=cur.data;
  if($('btnEdit'))$('btnEdit').onclick=function(){editMode=true;renderDetail();var root=$('kfRoot');if(CFC.pruefePhasen(d.pflegegrade).length)root.dataset.pgDirty='1';CFForm.bind(root);helferEditBinden(d);root.querySelectorAll('.wizardSteps [data-jump]').forEach(function(s){s.onclick=function(){var t=$(s.dataset.jump);if(t)t.scrollIntoView({behavior:'smooth',block:'start'})}})};
  if($('btnFix'))$('btnFix').onclick=function(){$('btnEdit').click()};
  ['btnCancel','btnCancel2'].forEach(function(id){if($(id))$(id).onclick=function(){editMode=false;renderDetail();ladeNotizen()}});
  ['btnSave','btnSave2'].forEach(function(id){if($(id))$(id).onclick=speichern});
  if($('btnClickup'))$('btnClickup').onclick=clickupOeffnen;
  if($('btnAufnDruck'))$('btnAufnDruck').onclick=function(){CFAufnahmeDruck.drucken(d)};
  if($('btnFaEdit'))$('btnFaEdit').onclick=function(){startFernaufnahme(d.pflege_name||'',prefillPayload(d))};
  if(editMode)return;
  $('btnNach').onclick=function(){$('resNach').innerHTML=CFC.nachweisHtml(d,$('optRueck').checked,$('optPar').checked);$('btnNachPrint').classList.remove('hidden')};
  $('btnNachPrint').onclick=function(){CFC.drucken(CFC.nachweisHtml(d,$('optRueck').checked,$('optPar').checked),'Curafact Nachweis – '+(d.pflege_name||''))};
  $('abzIn').oninput=function(){abzugAnzeige=$('abzIn').value;zeigeAuswertung()};
  document.querySelectorAll('#pnlAus .kfAbzBtn').forEach(function(b){b.onclick=function(){var i=$('abzIn'),v=parseFloat(String(i.value).replace(',','.'))||0;v=Math.max(0,Math.min(100,v+Number(b.dataset.d)));i.value=String(v).replace('.',',');abzugAnzeige=i.value;zeigeAuswertung()}});
  $('btnAusPrint').onclick=function(){zeigeAuswertung();CFC.drucken($('resAus').innerHTML,'Curafact Berechnung – '+(d.pflege_name||''))};
  zeigeAuswertung();
  $('noteBtn').onclick=notizSpeichern;
}

/* ---------- Speichern ---------- */
async function speichern(){
  var root=$('kfRoot'),alt=cur.data,neu=CFForm.collect(root,alt),ch={};
  helferEinsammeln(neu,alt);var fb=$('f_beratung');if(fb&&!!fb.checked!==!!alt.pflegeberatung_kunde)neu.pflegeberatung_kunde=!!fb.checked;
  var erlaubt=['pflege_anschrift','pflege_geburtsdatum','pflege_telefon','pflege_kasse','pflege_kvnr','person_name','person_anschrift','person_geburtsdatum','person_verhaeltnis','pflegegrade','pflegegrad_seit_angabe','pflegeberatung_kunde','entlastung_jahre','verhinderungspflege','abzug_prozent','aufnahme_notizen'];
  var diff=CFForm.geaendert(alt,neu);if(!('abzug_prozent' in alt)&&diff.abzug_prozent==='40')delete diff.abzug_prozent;erlaubt.forEach(function(k){if(k in diff)ch[k]=diff[k]});Object.keys(diff).forEach(function(k){if(/^hilfe\d*_(name|anschrift|geburtsdatum|telefon|sig_dataurl)$/.test(k))ch[k]=diff[k]});
  if(!Object.keys(ch).length){alert('Es wurde nichts geändert.');return}
  var w=CFC.pruefePhasen(ch.pflegegrade||neu.pflegegrade);if(w.length&&!confirm('Ein Datum im Pflegegrad ist ungültig:\n'+w.map(function(x){return x.text}).join('\n')+'\n\nTrotzdem speichern?'))return;
  document.querySelectorAll('#btnSave,#btnSave2').forEach(function(b){b.disabled=true});
  var r=await CFAPI.call('web_customer_save',{file:cur.file,changes:ch});
  if(!r||!r.ok){alert((r&&r.message)||'Speichern fehlgeschlagen.');document.querySelectorAll('#btnSave,#btnSave2').forEach(function(b){b.disabled=false});return}
  editMode=false;await ladeKunden();await oeffneKunde(cur.file);
}

/* ---------- ClickUp, Notizen ---------- */
async function clickupOeffnen(){
  var b=$('btnClickup');b.disabled=true;var r=await CFAPI.call('clickup_ensure_task',{name:cur.data.pflege_name,kind:'kunde'});b.disabled=false;
  if(r&&r.ok&&r.task_id)window.open('https://app.clickup.com/t/'+encodeURIComponent(r.task_id),'_blank','noopener');else alert((r&&r.message)||'ClickUp-Aufgabe konnte nicht geöffnet werden.');
}
async function ladeNotizen(){
  if(editMode||!$('notesList'))return;
  var r=await CFAPI.call('notes_list',{customer_name:cur.data.pflege_name||''});
  var el=$('notesList');if(!el)return;
  var n=(r&&r.notes)||[];
  el.innerHTML=n.length?n.map(function(x){return '<div style="padding:8px 0;border-bottom:1px solid var(--border)"><div class="mini">'+esc(new Date(x.created_at).toLocaleString('de-DE'))+' · '+esc(x.display_name||x.username||'')+'</div><div>'+esc(x.text).replace(/\n/g,'<br>')+'</div></div>'}).join(''):'<p class="mini">Noch keine Notizen.</p>';
}
async function notizSpeichern(){
  var t=$('noteText').value.trim();if(!t)return;
  $('noteBtn').disabled=true;var r=await CFAPI.call('notes_add',{customer_name:cur.data.pflege_name,text:t,kontext:'abrechnung'});$('noteBtn').disabled=false;
  if(r&&r.ok){$('noteText').value='';ladeNotizen()}else alert((r&&r.message)||'Notiz konnte nicht gespeichert werden.');
}

/* ---------- Fernaufnahme (Link / QR) – nur Abrechnung ---------- */
function toIso(v){var m=String(v||'').match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''}
function helfer(d){return helperPrefixe(d).map(function(n){var p=n===1?'hilfe':'hilfe'+n;return {name:d[p+'_name']||'',anschrift:d[p+'_anschrift']||'',geburtsdatum:d[p+'_geburtsdatum']||'',telefon:d[p+'_telefon']||'',sig_dataurl:d[p+'_sig_dataurl']||''}})}
function prefillPayload(d){
  return {pflege_name:d.pflege_name||'',pflege_anschrift:d.pflege_anschrift||'',pflege_geburtsdatum:toIso(d.pflege_geburtsdatum),pflege_kvnr:d.pflege_kvnr||'',pflege_kasse:d.pflege_kasse||'',pflege_telefon:d.pflege_telefon||'',pflege_sig_dataurl:d.pflege_sig_dataurl||'',
    person_name:d.person_name||'',person_anschrift:d.person_anschrift||'',person_geburtsdatum:toIso(d.person_geburtsdatum),person_verhaeltnis:d.person_verhaeltnis||'',
    pflegegrade:(Array.isArray(d.pflegegrade)?d.pflegegrade:[]),entlastung_jahre:d.entlastung_jahre||{},verhinderungspflege:Array.isArray(d.verhinderungspflege)?d.verhinderungspflege:[],nachbarschaftshilfen:helfer(d)};
}
function faMeldung(t){var e=$('faMsg');if(!e){e=document.createElement('div');e.id='faMsg';e.className='note noteBad';$('faNewBtn').parentNode.insertBefore(e,$('faNewBtn'))}e.textContent=t;e.classList.toggle('hidden',!t)}
async function startFernaufnahme(label,customer){
  faMeldung('');
  var r;
  try{r=await CFAPI.call('intake_create',{label:label,customer:customer||null})}catch(e){faMeldung('Fernaufnahme: Verbindung fehlgeschlagen ('+e+').');return}
  if(!r||!r.ok){faMeldung('Fernaufnahme konnte nicht gestartet werden: '+((r&&(r.message||('Status '+r.http_status)))||'keine Antwort')+'.');return}
  try{ startFernaufnahmeZeigen(label,customer,r) }catch(e){faMeldung('Fernaufnahme: Anzeige fehlgeschlagen ('+e+').')}
}
function startFernaufnahmeZeigen(label,customer,r){
  var base=location.href.replace(/[?#].*$/,'').replace(/[^\/]*$/,'');
  var url=base+'intake.html?s='+encodeURIComponent(r.session)+'&l='+encodeURIComponent(label||'Aufnahme');
  $('mTitle').textContent=customer?'Fernaufnahme – Änderungen':'Fernaufnahme – neuer Kunde';
  $('mLabel').textContent=(label&&label!=='Neuer Kunde')?('Für: '+label+' – Angaben werden in Studio diesem Kunden zugeordnet.'):'Link/QR-Code an den Kunden schicken. Die Angaben erscheinen danach in Studio.';
  $('mUrl').textContent=url;$('mQr').innerHTML='';
  try{new QRCode($('mQr'),{text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}catch(e){}
  $('mOpen').onclick=function(){window.open(url,'_blank','noopener')};
  $('mCopy').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(url).then(function(){$('mCopy').textContent='Kopiert ✓'})};
  $('mShare').onclick=function(){if(navigator.share)navigator.share({title:'Curafact Aufnahme',url:url});else $('mCopy').click()};
  $('modal').classList.remove('hidden');
}
$('mClose').onclick=function(){$('modal').classList.add('hidden')};
$('faNewBtn').onclick=neuerKunde;
async function neuerKunde(){
  zeigeAnsicht('kunden');cur=null;editMode=false;renderListe();faMeldung('');
  var r;try{r=await CFAPI.call('intake_create',{label:'Neuer Kunde',customer:null})}catch(e){r=null}
  if(!r||!r.ok){$('detail').innerHTML='<div class="note noteBad">Aufnahme konnte nicht gestartet werden: '+esc((r&&(r.message||('Status '+r.http_status)))||'keine Antwort')+'</div>';return}
  var base=location.href.replace(/[?#].*$/,'').replace(/[^\/]*$/,'');
  var q='intake.html?s='+encodeURIComponent(r.session)+'&l='+encodeURIComponent('Neuer Kunde');
  $('detail').innerHTML='<div class="cfTop"><div><h1>Neuer Kunde – Aufnahme</h1><p>Hier direkt ausfüllen und absenden. Die Angaben bleiben unter „Aufnahmen“ sichtbar und werden von Studio automatisch als Kunde übernommen. Soll der Kunde oder ein Angehöriger es selbst ausfüllen, nutze die Fernaufnahme per Link / QR.</p></div>'+
    '<div class="actions"><button class="primaryBtn" id="btnNkFern">Fernaufnahme per Link / QR</button><button id="btnNkClose">Schließen</button></div></div>'+
    '<iframe id="nkFrame" title="Aufnahme" src="'+esc(q+'&embed=1')+'" style="width:100%;height:calc(100vh - 170px);min-height:560px;border:1px solid var(--line);border-radius:18px;background:#eef4f9"></iframe>';
  $('btnNkFern').onclick=function(){startFernaufnahmeZeigen('Neuer Kunde',null,r)};
  $('btnNkClose').onclick=function(){$('detail').innerHTML='<div class="empty">Bitte links einen Kunden auswählen.</div>'};
}

(function(){
  try{var u=localStorage.getItem('curafact_web_user');if(u)$('loginUser').value=u}catch(e){}
  if(CFAPI.load())starteApp();else zeigeLogin('');
