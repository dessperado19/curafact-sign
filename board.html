<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Curafact Board</title>
<style>
:root{--blue:#0E4A8B;--blue2:#07345f;--cyan:#20C6D4;--bg:#f5f8fb;--border:#dbe7f0;--text:#16324f;--muted:#66788a;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{max-width:1500px;margin:0 auto;padding:12px 14px 40px}
#head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px}#head .who{flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#head img{height:34px}
#head .who{font-size:13px;color:var(--muted)}
#head .who strong{color:var(--blue)}
button{font-family:inherit;border:1px solid var(--border);background:#fff;color:var(--blue);border-radius:10px;font-weight:700;padding:9px 14px;cursor:pointer;font-size:14px}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
#login{max-width:340px;margin:70px auto 0;background:#fff;border-radius:16px;padding:28px;box-shadow:0 10px 40px rgba(14,74,139,.15);text-align:center}
#login img{height:44px;margin-bottom:10px}
#login h2{margin:0 0 4px;color:var(--blue)}
#login p{margin:0 0 16px;color:var(--muted);font-size:13px}
#login input{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:16px;text-align:center;margin-bottom:10px}
#login input#code{font-size:24px;letter-spacing:7px}
#loginErr{color:#b91c1c;font-size:13px;min-height:16px;margin:4px 0 10px}
.hidden{display:none!important}
</style></head><body>
<div id="login" class="hidden">
  <img src="logo.png" alt="Curafact">
  <h2>Curafact Board</h2>
  <p>Benutzername und Code aus der Authenticator-App</p>
  <form id="loginForm">
    <input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Benutzername">
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
    <div id="loginErr"></div>
    <button class="primary" style="width:100%" type="submit">Anmelden</button>
  </form>
</div>
<div class="wrap hidden" id="app">
  <div id="head"><img src="logo.png" alt="Curafact"><span class="who" id="who"></span><button id="logout">Abmelden</button></div>
  <div id="bdRoot"></div>
</div>
<!--BD:START-->
<style>
.bd{--bd-blue:var(--blue,#0E4A8B);--bd-border:var(--border,#dbe7f0);--bd-muted:var(--muted,#66788a);--bd-text:var(--text,#16324f);--bd-cyan:var(--cyan,#20C6D4);--bd-bg:var(--bg,#f5f8fb);color:var(--bd-text);font-size:14px}
.bd *{box-sizing:border-box}
.bd button{font-family:inherit}
.bdBar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bdTabs,.bdViews{display:flex;gap:6px;flex-wrap:wrap}
.bdTab,.bdViewBtn,.bdBtn{border:1px solid var(--bd-border);background:#fff;color:var(--bd-blue);border-radius:12px;padding:9px 13px;font-weight:800;cursor:pointer;font-size:14px}
.bdTab.on,.bdViewBtn.on{background:var(--bd-blue);color:#fff;border-color:var(--bd-blue)}
.bdBtn.primary{background:var(--bd-blue);color:#fff;border-color:var(--bd-blue)}
.bdBtn.danger{color:#b91c1c}
.bdBtn:hover,.bdTab:hover,.bdViewBtn:hover{border-color:var(--bd-cyan)}
.bdBtn[disabled]{opacity:.5;cursor:default}
.bdSearch{flex:1;min-width:150px;max-width:280px;border:1px solid var(--bd-border);border-radius:12px;padding:9px 12px;font-size:14px;background:#fff}
.bdSpacer{flex:1}
.bdChk{display:flex;gap:6px;align-items:center;font-weight:700;color:var(--bd-muted);cursor:pointer}
.bdChk input{width:auto}
.bdBoard{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;-webkit-overflow-scrolling:touch}
.bdCol{flex:0 0 285px;background:#eaf2f8;border-radius:16px;padding:10px;display:flex;flex-direction:column;max-height:calc(100vh - 230px);min-height:90px}
.bdCol.over{outline:2px dashed var(--bd-cyan);background:#e0f6f9}
.bdColHead{display:flex;align-items:center;gap:8px;margin:2px 2px 10px;font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.03em;color:var(--bd-blue)}
.bdDot{width:10px;height:10px;border-radius:50%;flex:none}
.bdCount{background:#fff;border-radius:999px;padding:1px 8px;font-size:12px;color:var(--bd-muted)}
.bdAdd{margin-left:auto;border:0;background:transparent;font-size:20px;line-height:1;color:var(--bd-blue);cursor:pointer;padding:0 4px}
.bdCards{overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:30px;padding:2px}
.bdCard{background:#fff;border:1px solid var(--bd-border);border-radius:12px;padding:10px 11px;cursor:pointer;box-shadow:0 3px 10px rgba(14,74,139,.06);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bdCard:hover{border-color:var(--bd-cyan)}
.bdCard.dragging{opacity:.35}
.bdCard.inactive{opacity:.55;background:#f1f4f7;filter:grayscale(1)}
.bdCard.inactive:hover{opacity:.85}
.bdT{font-weight:800;line-height:1.3;word-break:break-word}
.bdMeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.bdChip{font-size:12px;border-radius:999px;padding:2px 8px;background:#eef3f7;color:var(--bd-muted);font-weight:700;white-space:nowrap}
.bdChip.late{background:#fde8e8;color:#b91c1c}
.bdChip.done{background:#dff7ee;color:#087044}
.bdChip.tag{background:#e9f8fa;color:#087884}
.bdChip.dup{background:#fff4dd;color:#8a5a00}
.bdAv{width:22px;height:22px;border-radius:50%;background:var(--bd-blue);color:#fff;font-size:10px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;margin-left:auto}
.bdAvs{display:flex;margin-left:auto}.bdAvs .bdAv{margin-left:-6px;border:2px solid #fff}
.bdPrio{width:8px;height:8px;border-radius:50%;display:inline-block}
.bdMore{border:1px dashed var(--bd-border);background:transparent;border-radius:10px;padding:7px;color:var(--bd-muted);font-weight:700;cursor:pointer}
.bdQuick{width:100%;border:1px solid var(--bd-cyan);border-radius:10px;padding:9px;font-size:14px;margin-bottom:8px}
.bdGhost{position:fixed;z-index:100000;pointer-events:none;width:260px;opacity:.92;transform:rotate(2deg);box-shadow:0 14px 30px rgba(0,0,0,.25)}
.bdTable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--bd-border);border-radius:12px;overflow:hidden}
.bdTable th{background:#f2f8fc;color:var(--bd-blue);text-align:left;font-size:12px;text-transform:uppercase;padding:10px}
.bdTable td{padding:10px;border-top:1px solid var(--bd-border);vertical-align:top}
.bdTable tr.row{cursor:pointer}.bdTable tr.row:hover{background:#f7fcfd}
.bdCal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.bdCalHead{font-weight:900;color:var(--bd-muted);font-size:12px;text-align:center;padding:4px}
.bdDay{background:#fff;border:1px solid var(--bd-border);border-radius:10px;min-height:92px;padding:5px;overflow:hidden}
.bdDay.out{background:#f3f7fa;opacity:.7}.bdDay.today{border-color:var(--bd-cyan);box-shadow:0 0 0 2px #bff0f5}
.bdDayNum{font-size:12px;font-weight:900;color:var(--bd-muted)}
.bdEv{display:block;width:100%;text-align:left;border:0;background:#e6f0fa;color:var(--bd-blue);border-radius:6px;padding:3px 5px;margin-top:3px;font-size:12px;font-weight:700;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bdEv.done{background:#dff7ee;color:#087044}
.bdMonth{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:900;font-size:17px}
.bdModalBg{position:fixed;inset:0;background:rgba(7,32,58,.5);z-index:9999;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.bdModal{background:#fff;border-radius:18px;width:100%;max-width:760px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.bdModal.small{max-width:430px}
.bdModal h3{margin:0 0 12px;color:var(--bd-blue)}
.bdTitleIn{width:100%;font-size:20px;font-weight:900;border:1px solid transparent;border-radius:10px;padding:6px 8px;color:var(--bd-blue);background:transparent}
.bdTitleIn:hover,.bdTitleIn:focus{border-color:var(--bd-border);background:#fff}
.bdGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.bdGrid label,.bdLbl{display:block;font-size:12px;font-weight:900;color:var(--bd-muted);text-transform:uppercase;margin-bottom:4px}
.bdGrid select,.bdGrid input,.bdModal textarea,.bdModal input[type=text],.bdModal input[type=date],.bdModal select{width:100%;border:1px solid var(--bd-border);border-radius:10px;padding:9px 10px;font-size:14px;font-family:inherit;background:#fff}
.bdModal textarea{min-height:90px;resize:vertical}
.bdSec{margin-top:18px}
.bdSecHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.bdSecHead h4{margin:0;color:var(--bd-blue);font-size:15px}
.bdPeople{display:flex;flex-wrap:wrap;gap:6px}
.bdPerson{border:1px solid var(--bd-border);background:#fff;border-radius:999px;padding:5px 11px;cursor:pointer;font-weight:700;color:var(--bd-muted)}
.bdPerson.on{background:var(--bd-blue);color:#fff;border-color:var(--bd-blue)}
.bdCl{border:1px solid var(--bd-border);border-radius:12px;padding:10px;margin-bottom:10px;background:#fbfdff}
.bdClHead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.bdClHead b{flex:1;color:var(--bd-blue);cursor:pointer}
.bdBar2{height:6px;background:#e3edf4;border-radius:99px;overflow:hidden;margin:4px 0 8px}.bdBar2 i{display:block;height:100%;background:var(--bd-cyan)}
.bdIt{display:flex;gap:8px;align-items:flex-start;padding:5px 2px;border-bottom:1px solid #eef3f7}
.bdIt:last-of-type{border-bottom:0}
.bdIt input[type=checkbox]{width:18px;height:18px;margin-top:2px;flex:none}
.bdIt span{flex:1;word-break:break-word;cursor:text}.bdIt.res span{text-decoration:line-through;color:var(--bd-muted)}
.bdIt input[type=text]{flex:1;padding:4px 6px}
.bdX{border:0;background:transparent;color:var(--bd-muted);cursor:pointer;font-size:16px;padding:0 4px}.bdX:hover{color:#b91c1c}
.bdCm{background:#f4f8fb;border-radius:10px;padding:9px 11px;margin-bottom:8px}
.bdCm small{color:var(--bd-muted);display:block;margin-bottom:3px}.bdCm p{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--bd-text)}
.bdLog{font-size:12px;color:var(--bd-muted);padding:2px 0}
.bdFile{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eef3f7}.bdFile a{flex:1;color:var(--bd-blue);font-weight:700;cursor:pointer;word-break:break-all}
.bdRow{display:flex;gap:8px;align-items:center}
.bdToast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0b457f;color:#fff;border-radius:12px;padding:10px 16px;z-index:100001;font-weight:700;max-width:90vw}.bdToast.err{background:#b91c1c}
.bdEmpty{background:#fff;border:1px solid var(--bd-border);border-radius:14px;padding:18px;color:var(--bd-muted)}
.bdProg{height:10px;background:#e3edf4;border-radius:99px;overflow:hidden;margin:10px 0}.bdProg i{display:block;height:100%;background:var(--bd-blue);width:0}
.bdLogBox{background:#f2f6f9;border-radius:10px;padding:10px;font-size:12px;max-height:160px;overflow:auto;white-space:pre-wrap}
@media(max-width:700px){.bdTabs{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px}.bdTab{white-space:nowrap;flex:none}.bdViews{width:100%}.bdViewBtn{flex:1}.bdSearch{max-width:none;min-width:0;flex:1 1 100%}.bdBar{gap:8px}.bdBtn{padding:8px 11px}.bdGrid{grid-template-columns:1fr}.bdCol{flex-basis:82vw;max-height:calc(100vh - 260px)}.bdModalBg{padding:0}.bdModal{border-radius:0;min-height:100vh;max-width:none}.bdDay{min-height:60px}.bdEv{font-size:10px}}
</style>
<script>
(function(){
'use strict';
var S={lists:[],tasks:new Map(),users:[],listId:null,view:'board',q:'',mine:false,allLists:false,since:null,month:new Date(),root:null,timer:null,drag:null,more:{},loaded:false};
var PRIO={urgent:['Dringend','#b91c1c'],high:['Hoch','#e07a00'],normal:['Normal','#1090e0'],low:['Niedrig','#66788a']};
function H(){return window.BD_HOST||{}}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(s,r){return (r||S.root).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||S.root).querySelectorAll(s))}
function store(k,v){try{if(v===undefined)return localStorage.getItem('bd_'+k);localStorage.setItem('bd_'+k,v)}catch(e){return null}}
async function call(a,p){
  try{var r=await H().call(a,p||{});if(!r)return{ok:false,message:'Keine Antwort vom Server.'};return r}
  catch(e){return{ok:false,message:'Fehler: '+e}}
}
var toastT;
function msg(t,err){var el=$('.bdToast');el.textContent=t;el.className='bdToast'+(err?' err':'');el.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){el.style.display='none'},err?6000:2500)}
function fmtDate(d){if(!d)return'';var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d);return m?m[3]+'.'+m[2]+'.'+m[1]:d}
function fmtTs(t){if(!t)return'';var d=new Date(t);return isNaN(d)?'':d.toLocaleDateString('de-DE')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ymd(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function curList(){return S.lists.find(function(l){return l.id===S.listId})||null}
function statuses(l){var a=(l&&Array.isArray(l.statuses))?l.statuses.slice():[];var rank=function(s){return String(s.name).toLowerCase()==='nicht aktiv'?2:(s.type==='closed'?1:0)};return a.map(function(s,i){return[s,i]}).sort(function(x,y){return rank(x[0])-rank(y[0])||x[1]-y[1]}).map(function(x){return x[0]})}
function isClosedStatus(l,s){var x=statuses(l).find(function(z){return z.name===s});return !!x&&(x.type==='closed'||x.type==='done')}
function listOf(t){return S.lists.find(function(l){return l.id===t.list_id})}
var PREFIX=['Pflegebedürftiger: ','Pflegeberatung: '];
function shownTitle(t){var n=t.title||'';for(var i=0;i<PREFIX.length;i++){if(n.indexOf(PREFIX[i])===0)return n.slice(PREFIX[i].length)}return n}
function initials(u){var x=S.users.find(function(z){return z.username===u});var n=(x&&x.display_name)||u||'?';var p=n.trim().split(/\s+/);return((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase()}
function userName(u){var x=S.users.find(function(z){return z.username===u});return(x&&x.display_name)||u||''}
function me(){return(H().user||{}).username||''}
function visible(t){
  if(!S.allLists&&t.list_id!==S.listId)return false;
  if(S.mine&&(t.assignees||[]).indexOf(me())<0)return false;
  if(S.q){var h=((t.title||'')+' '+(t.customer_name||'')+' '+(t.tags||[]).join(' ')).toLowerCase();if(h.indexOf(S.q.toLowerCase())<0)return false}
  return true;
}

/* ---------- Laden ---------- */
async function load(full){
  var r=await call('board_load',(full||!S.since)?{}:{since:S.since});
  if(!r.ok){msg(r.message||'Board konnte nicht geladen werden.',true);return false}
  if(r.full)S.tasks=new Map();
  if(r.lists)S.lists=r.lists;
  if(r.users)S.users=r.users;
  (r.tasks||[]).forEach(function(t){if(t.deleted_at)S.tasks.delete(t.id);else S.tasks.set(t.id,t)});
  S.since=new Date(Date.parse(r.server_time)-5000).toISOString();
  if(!S.listId||!curList()){var saved=store('list');S.listId=(S.lists.find(function(l){return l.id===saved})||S.lists[0]||{}).id||null}
  S.loaded=true;
  return true;
}
async function refresh(full){if(S.drag||S.modalOpen)return;if(await load(full))render()}

/* ---------- Grundgerüst ---------- */
function shell(){
  S.root.innerHTML='<div class="bd"><div class="bdBar" id="bdBar"></div><div id="bdBody"></div><div class="bdToast" style="display:none"></div><div id="bdModalHost"></div></div>';
}
function renderBar(){
  var h='<div class="bdTabs">'+S.lists.map(function(l){return'<button class="bdTab'+(l.id===S.listId?' on':'')+'" data-list="'+l.id+'">'+esc(l.name)+'</button>'}).join('')+'</div>';
  h+='<div class="bdViews">'+[['board','Board'],['list','Liste'],['cal','Kalender']].map(function(v){return'<button class="bdViewBtn'+(S.view===v[0]?' on':'')+'" data-view="'+v[0]+'">'+v[1]+'</button>'}).join('')+'</div>';
  h+='<input class="bdSearch" id="bdQ" placeholder="Suchen …" value="'+esc(S.q)+'">';
  h+='<label class="bdChk"><input type="checkbox" id="bdMine"'+(S.mine?' checked':'')+'> Meine</label>';
  if(S.view==='cal')h+='<label class="bdChk"><input type="checkbox" id="bdAll"'+(S.allLists?' checked':'')+'> alle Listen</label>';
  h+='<span class="bdSpacer"></span><button class="bdBtn primary" id="bdNew">+ Aufgabe</button><button class="bdBtn" id="bdTrash" title="Papierkorb">Papierkorb</button>';
  if(H().isAdmin)h+='<button class="bdBtn" id="bdDupes" title="Doppelte Kunden-Aufgaben zusammenführen">Duplikate</button><button class="bdBtn" id="bdImport">Aus ClickUp übernehmen</button>';
  h+='<button class="bdBtn" id="bdReload" title="Neu laden">↻</button>';
  $('#bdBar').innerHTML=h;
}
function render(){
  if(!S.root)return;
  var keep=$('.bdBoard');var sl=keep?keep.scrollLeft:0;
  renderBar();
  if(!S.lists.length){$('#bdBody').innerHTML='<div class="bdEmpty">Noch keine Listen. Ein Administrator kann die Aufgaben mit „Aus ClickUp übernehmen“ importieren.</div>';return}
  if(S.view==='list')renderList();else if(S.view==='cal')renderCal();else renderBoard();
  var b=$('.bdBoard');if(b)b.scrollLeft=sl;
}

/* ---------- Board ---------- */
function cardHtml(t){
  var l=listOf(t),closed=isClosedStatus(l,t.status),m='';
  if(t.priority&&PRIO[t.priority]&&t.priority!=='normal')m+='<span class="bdPrio" title="'+PRIO[t.priority][0]+'" style="background:'+PRIO[t.priority][1]+'"></span>';
  if(t.due_date)m+='<span class="bdChip'+((!closed&&t.due_date<todayStr())?' late':'')+'">'+fmtDate(t.due_date)+'</span>';
  if(t.chk_total)m+='<span class="bdChip'+(t.chk_done===t.chk_total?' done':'')+'">☑ '+t.chk_done+'/'+t.chk_total+'</span>';
  if(t.n_comments)m+='<span class="bdChip">💬 '+t.n_comments+'</span>';
  if(t.n_files)m+='<span class="bdChip">📎 '+t.n_files+'</span>';
  (t.tags||[]).forEach(function(g){m+='<span class="bdChip '+(g==='Duplikat?'?'dup':'tag')+'">'+esc(g)+'</span>'});
  var av=(t.assignees||[]).slice(0,3).map(function(u){return'<span class="bdAv" title="'+esc(userName(u))+'">'+esc(initials(u))+'</span>'}).join('');
  if(av)m+='<span class="bdAvs">'+av+'</span>';
  return'<div class="bdCard'+(String(t.status).toLowerCase()==='nicht aktiv'?' inactive':'')+'" data-id="'+t.id+'"><div class="bdT">'+esc(shownTitle(t))+'</div>'+(m?'<div class="bdMeta">'+m+'</div>':'')+'</div>';
}
function renderBoard(){
  var l=curList();var st=statuses(l);
  var tasks=Array.from(S.tasks.values()).filter(function(t){return t.list_id===S.listId&&visible(t)});
  var h='<div class="bdBoard">';
  st.forEach(function(s){
    var cs=tasks.filter(function(t){return t.status===s.name});
    var closed=s.type==='closed'||s.type==='done';
    cs.sort(closed?function(a,b){return String(b.closed_at||b.updated_at).localeCompare(String(a.closed_at||a.updated_at))}:function(a,b){return a.position-b.position});
    var lim=closed?(S.more[s.name]||15):9999;
    h+='<div class="bdCol" data-status="'+esc(s.name)+'"><div class="bdColHead"><span class="bdDot" style="background:'+esc(s.color||'#66788a')+'"></span>'+esc(s.name)+'<span class="bdCount">'+cs.length+'</span><button class="bdAdd" data-add="'+esc(s.name)+'" title="Aufgabe hinzufügen">+</button></div><div class="bdCards">';
    h+='<div class="bdQuickHost"></div>';
    cs.slice(0,lim).forEach(function(t){h+=cardHtml(t)});
    if(cs.length>lim)h+='<button class="bdMore" data-more="'+esc(s.name)+'">'+(cs.length-lim)+' weitere anzeigen</button>';
    h+='</div></div>';
  });
  $('#bdBody').innerHTML=h+'</div>';
}

/* ---------- Liste ---------- */
function renderList(){
  var l=curList();
  var tasks=Array.from(S.tasks.values()).filter(function(t){return t.list_id===S.listId&&visible(t)});
  var order=statuses(l).map(function(s){return s.name});

function renderCal(){
  var y=S.month.getFullYear(),mo=S.month.getMonth();
  var first=new Date(y,mo,1),offs=(first.getDay()+6)%7,days=new Date(y,mo+1,0).getDate();
  var MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  var byDay={};
  S.tasks.forEach(function(t){if(t.due_date&&visible(t)){(byDay[t.due_date]=byDay[t.due_date]||[]).push(t)}});
  var h='<div class="bdMonth"><button class="bdBtn" data-mon="-1">‹</button><span>'+MN[mo]+' '+y+'</span><button class="bdBtn" data-mon="1">›</button><button class="bdBtn" data-mon="0">Heute</button></div><div class="bdCal">';
  ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(function(d){h+='<div class="bdCalHead">'+d+'</div>'});
  var total=Math.ceil((offs+days)/7)*7;
  for(var i=0;i<total;i++){
    var dn=i-offs+1,d=new Date(y,mo,dn),key=ymd(d.getFullYear(),d.getMonth(),d.getDate());
    h+='<div class="bdDay'+(dn<1||dn>days?' out':'')+(key===todayStr()?' today':'')+'"><div class="bdDayNum">'+d.getDate()+'</div>';
    (byDay[key]||[]).forEach(function(t){h+='<button class="bdEv'+(isClosedStatus(listOf(t),t.status)?' done':'')+'" data-id="'+t.id+'" title="'+esc(shownTitle(t))+'">'+esc(shownTitle(t))+'</button>'});
    h+='</div>';
  }
  $('#bdBody').innerHTML=h+'</div>';
}

/* ---------- Ziehen (Maus und Touch) ---------- */
function startDrag(card,x,y){
  var id=card.dataset.id,t=S.tasks.get(id);if(!t)return;
  var g=card.cloneNode(true);g.className='bdCard bdGhost';document.body.appendChild(g);
  card.classList.add('dragging');
  S.drag={id:id,card:card,ghost:g,col:null};
  moveDrag(x,y);
}
function colAt(x,y){
  S.drag.ghost.style.display='none';var el=document.elementFromPoint(x,y);S.drag.ghost.style.display='';
  return el&&el.closest?el.closest('.bdCol'):null;
}
function moveDrag(x,y){
  var d=S.drag;if(!d)return;
  d.ghost.style.left=(x-130)+'px';d.ghost.style.top=(y-20)+'px';
  var c=colAt(x,y);
  if(c!==d.col){if(d.col)d.col.classList.remove('over');if(c)c.classList.add('over');d.col=c}
  var b=$('.bdBoard');
  if(b){var r=b.getBoundingClientRect();if(x<r.left+50)b.scrollLeft-=14;else if(x>r.right-50)b.scrollLeft+=14}
}
function endDrag(x,y){
  var d=S.drag;if(!d)return;
  var col=colAt(x,y)||d.col;
  d.ghost.remove();d.card.classList.remove('dragging');$$('.bdCol.over').forEach(function(c){c.classList.remove('over')});
  S.drag=null;
  if(!col)return;
  var status=col.dataset.status;
  var others=$$('.bdCard',col).filter(function(c){return c!==d.card&&!c.classList.contains('bdGhost')});
  var idx=others.length;
  for(var i=0;i<others.length;i++){var r=others[i].getBoundingClientRect();if(y<r.top+r.height/2){idx=i;break}}
  var pos=function(i){var t=S.tasks.get(others[i].dataset.id);return t?Number(t.position):0};
  var np;
  if(!others.length)np=1000;else if(idx===0)np=pos(0)-1000;else if(idx>=others.length)np=pos(others.length-1)+1000;else np=(pos(idx-1)+pos(idx))/2;
  var t=S.tasks.get(d.id);if(!t)return;
  if(t.status===status&&Math.abs(np-Number(t.position))<1e-9)return;
  var old={status:t.status,position:t.position};
  t.status=status;t.position=np;render();
  call('board_task_move',{id:d.id,status:status,position:np}).then(function(r){
    if(!r.ok){t.status=old.status;t.position=old.position;render();msg(r.message||'Verschieben fehlgeschlagen.',true)}
    else if(r.task){S.tasks.set(d.id,Object.assign({},t,{closed_at:r.task.closed_at,updated_at:r.task.updated_at}));render()}
  });
}
function bindDrag(){
  var root=S.root,st=null,TH=6;
  root.addEventListener('mousedown',function(e){
    if(e.button!==0)return;var c=e.target.closest('.bdCard:not(.bdGhost)');if(!c||!root.contains(c))return;
    st={card:c,x:e.clientX,y:e.clientY,touch:false};
  });
  window.addEventListener('mousemove',function(e){
    if(S.drag){moveDrag(e.clientX,e.clientY);e.preventDefault();return}
    if(st&&!st.touch&&(Math.abs(e.clientX-st.x)>TH||Math.abs(e.clientY-st.y)>TH)){startDrag(st.card,e.clientX,e.clientY);st.started=true}
  });
  window.addEventListener('mouseup',function(e){
    if(S.drag){S.dragJustEnded=true;setTimeout(function(){S.dragJustEnded=false},50);endDrag(e.clientX,e.clientY)}
    st=null;
  });
  root.addEventListener('touchstart',function(e){
    var c=e.target.closest('.bdCard:not(.bdGhost)');if(!c)return;var t=e.touches[0];
    st={card:c,x:t.clientX,y:t.clientY,touch:true};
    clearTimeout(st.timer);
    st.timer=setTimeout(function(){if(st&&st.touch&&!S.drag){startDrag(st.card,st.x,st.y);if(navigator.vibrate)navigator.vibrate(15)}},380);
  },{passive:true});
  root.addEventListener('touchmove',function(e){
    var t=e.touches[0];
    if(S.drag){e.preventDefault();moveDrag(t.clientX,t.clientY);return}
    if(st&&st.touch&&(Math.abs(t.clientX-st.x)>TH||Math.abs(t.clientY-st.y)>TH)){clearTimeout(st.timer);st=null}
  },{passive:false});
  function tEnd(e){
    if(st)clearTimeout(st.timer);
    if(S.drag){var t=(e.changedTouches&&e.changedTouches[0])||{clientX:0,clientY:0};S.dragJustEnded=true;setTimeout(function(){S.dragJustEnded=false},50);endDrag(t.clientX,t.clientY)}
    st=null;
  }
  root.addEventListener('touchend',tEnd);root.addEventListener('touchcancel',tEnd);
}

    msg('Lade '+f.name+' hoch …');
    var r=await call('board_attachment_add',{task_id:t.id,file_name:f.name,content_type:f.type,file_b64:b64});

  }
  reopen();
}

}

  var running=false,cancel=false;
  var draw=function(body){host.innerHTML='<div class="bdModalBg"><div class="bdModal"><h3>Aufgaben aus ClickUp übernehmen</h3>'+body+'</div></div>'};
  draw('<p>ClickUp wird nur gelesen, dort wird nichts verändert. Bereits übernommene Aufgaben werden übersprungen.</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="imClose">Abbrechen</button><button class="bdBtn primary" id="imScan">Prüfen</button></div>');
  host.onclick=async function(e){
    if(e.target.id==='imClose'){cancel=true;if(!running){host.onclick=null;host.innerHTML='';S.modalOpen=false;render()}return}
    if(e.target.id==='imDone'){host.onclick=null;host.innerHTML='';S.modalOpen=false;await load(true);render();return}
    if(e.target.id==='imScan'){
      draw('<p>Lese ClickUp …</p>');
      var sc=await call('board_import_scan');
      if(!sc.ok){draw('<p style="color:#b91c1c">'+esc(sc.message||'Fehler')+'</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="imClose">Schließen</button></div>');return}
      S.scan=sc.lists;
      var open=0;sc.lists.forEach(function(l){open+=l.ids.length-l.imported});
      draw('<p>Gefunden:</p><ul>'+sc.lists.map(function(l){return'<li><b>'+esc(l.name)+'</b>: '+l.ids.length+' Aufgaben, davon schon übernommen: '+l.imported+'</li>'}).join('')+'</ul><p>Noch zu übernehmen: <b>'+open+'</b>'+(open?' (dauert etwa '+Math.max(1,Math.round(open/8*10/60))+' Minuten)':'')+'</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="imClose">Abbrechen</button><button class="bdBtn primary" id="imGo">Übernehmen</button></div>');
      return;
    }
    if(e.target.id==='imGo'){
      running=true;cancel=false;
      var tot=0,got=0,fails=[],logTxt='';
      S.scan.forEach(function(l){tot+=l.ids.length});
      var upd=function(txt){draw('<p>'+esc(txt)+'</p><div class="bdProg"><i style="width:'+(tot?Math.min(100,Math.round(got*100/tot)):0)+'%"></i></div><div class="bdLogBox">'+esc(logTxt)+'</div>')};
      var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
      for(var li=0;li<S.scan.length&&!cancel;li++){
        var L=S.scan[li];
        // bereits übernommene Aufgaben werden serverseitig übersprungen
        for(var i=0;i<L.ids.length&&!cancel;i+=8){
          upd('Übernehme „'+L.name+'“ … '+got+' von '+tot);
          var batch=L.ids.slice(i,i+8);
          var r=await call('board_import_tasks',{list_id:L.list_id,ids:batch});
          if(!r.ok){logTxt+='Fehler: '+(r.message||'unbekannt')+'\n';await sleep(8000);r=await call('board_import_tasks',{list_id:L.list_id,ids:batch});if(!r.ok){fails=fails.concat(batch);continue}}
          got+=batch.length;(r.failed||[]).forEach(function(f){fails.push(f)});
          if(r.imported)logTxt+=L.name+': '+r.imported+' übernommen\n';
          if(r.imported)await sleep(5000);
        }
      }
      if(!cancel){
        var st=await call('board_import_stats');
        if(st.ok&&st.pending){
          logTxt+='Anhänge: '+st.pending+' ('+bytesFmt(st.pending_bytes)+')\n';
          var guard=0;
          while(!cancel&&guard++<400){upd('Übernehme Anhänge …');var fr=await call('board_import_files');if(!fr.ok){logTxt+=(fr.message||'Fehler bei Anhängen')+'\n';break}(fr.failed||[]).forEach(function(f){logTxt+='Anhang nicht übernommen: '+f+'\n'});if(!fr.remaining||fr.done===0&&!(fr.failed||[]).length)break}
        }
        var fin=await call('board_import_finish');
        if(fin.ok&&fin.marked)logTxt+='Mögliche Duplikate markiert: '+fin.marked+'\n';
      }
      running=false;
      draw('<p><b>'+(cancel?'Abgebrochen.':'Fertig.')+'</b> '+got+' von '+tot+' Aufgaben verarbeitet.'+(fails.length?' Fehlgeschlagen: '+fails.length+' (Import einfach erneut starten).':'')+'</p><div class="bdLogBox">'+esc(logTxt)+'</div><div class="bdRow" style="justify-content:flex-end;margin-top:12px"><button class="bdBtn primary" id="imDone">Schließen</button></div>');
      return;
    }
  };
}

/* ---------- Duplikate zusammenführen (nur Admin) ---------- */
async function runDupes(){
  var host=$('#bdModalHost');S.modalOpen=true;
  var draw=function(body){host.innerHTML='<div class="bdModalBg"><div class="bdModal small"><h3>Duplikate zusammenführen</h3>'+body+'</div></div>'};
  var close=async function(reload){host.onclick=null;host.innerHTML='';S.modalOpen=false;if(reload)await load(true);render()};
  draw('<p>Prüfe …</p>');
  var r=await call('board_dupes_merge',{dry:true});
  if(!r.ok){draw('<p style="color:#b91c1c">'+esc(r.message||'Fehler')+'</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="dpClose">Schließen</button></div>');host.onclick=function(e){if(e.target.id==='dpClose')close(false)};return}
  if(!r.duplicates){draw('<p>Keine doppelten Aufgaben gefunden.</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="dpClose">Schließen</button></div>');host.onclick=function(e){if(e.target.id==='dpClose')close(false)};return}
  draw('<p><b>'+r.duplicates+'</b> doppelte Aufgaben in <b>'+r.groups+'</b> Gruppen (gleicher Kundenname).</p><p class="bdLog">Beispiele: '+esc((r.examples||[]).join(', '))+'</p><p>Die älteste Aufgabe bleibt. Checklisten-Einträge, Kommentare und Anhänge der anderen wandern dorthin, die Dublette landet im Papierkorb (wiederherstellbar). Als Status gilt der der zuletzt bearbeiteten Aufgabe.</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="dpClose">Abbrechen</button><button class="bdBtn primary" id="dpGo">Zusammenführen</button></div>');
  var running=false;
  host.onclick=async function(e){
    if(e.target.id==='dpClose'&&!running){close(false);return}
    if(e.target.id==='dpDone'){close(true);return}
    if(e.target.id==='dpGo'){
      running=true;var done=0,guard=0,total=r.groups;
      while(guard++<200){
        draw('<p>Führe zusammen … '+done+' von '+total+' Gruppen</p><div class="bdProg"><i style="width:'+Math.round(done*100/Math.max(1,total))+'%"></i></div>');
        var m=await call('board_dupes_merge',{dry:false,limit:8});
        if(!m.ok){draw('<p style="color:#b91c1c">'+esc(m.message||'Fehler')+' (nochmal starten setzt fort)</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn" id="dpDone">Schließen</button></div>');running=false;return}
        done+=m.merged;if(!m.remaining)break;
      }
      running=false;
      draw('<p><b>Fertig.</b> '+done+' Gruppen zusammengeführt.</p><div class="bdRow" style="justify-content:flex-end"><button class="bdBtn primary" id="dpDone">Schließen</button></div>');
    }
  };
}

/* ---------- Ereignisse ---------- */
function bindEvents(){
  var root=S.root;
  root.addEventListener('click',async function(e){
    var el=e.target;
    if(S.dragJustEnded)return;
    var host=$('#bdModalHost');
    if(S.modalOpen&&host.contains(el)){
      if(S.cur&&$('#bdTaskBg'))return taskClick(e);
      if(el.id==='trClose'||el.id==='bdTrashBg'){S.modalOpen=false;host.innerHTML='';render();return}
      var rs=el.closest('[data-restore]');if(rs){var r=await call('board_task_restore',{id:rs.dataset.restore});if(r.ok){msg('Wiederhergestellt');await load(true);showTrash()}else msg(r.message,true)}
      return;
    }
    var x;
    if((x=el.closest('[data-list]'))){S.listId=x.dataset.list;store('list',S.listId);render();return}
    if((x=el.closest('[data-view]'))){S.view=x.dataset.view;store('view',S.view);render();return}
    if(el.id==='bdReload'){refresh(true);return}
    if(el.id==='bdTrash'){showTrash();return}
    if(el.id==='bdImport'){runImport();return}
    if(el.id==='bdDupes'){runDupes();return}
    if(el.id==='bdNew'){var t=await dlg({title:'Neue Aufgabe',input:'',ok:'Anlegen'});if(t)createTask(t,null);return}
    if((x=el.closest('[data-add]'))){
      var colEl=x.closest('.bdCol'),qh=$('.bdQuickHost',colEl);if(qh.firstChild)return;
      qh.innerHTML='<input class="bdQuick" placeholder="Titel, Enter zum Anlegen">';var inp=$('input',qh);inp.focus();
      var done=false;inp.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&inp.value.trim()){done=true;createTask(inp.value.trim(),x.dataset.add)}if(ev.key==='Escape'){done=true;qh.innerHTML=''}});
      inp.addEventListener('blur',function(){if(!done)qh.innerHTML=''});return;
    }
    if((x=el.closest('[data-more]'))){S.more[x.dataset.more]=(S.more[x.dataset.more]||15)+30;render();return}
    if((x=el.closest('[data-mon]'))){var d=Number(x.dataset.mon);S.month=d===0?new Date():new Date(S.month.getFullYear(),S.month.getMonth()+d,1);render();return}
    if((x=el.closest('.bdCard,.bdEv,tr.row'))&&x.dataset.id){openTask(x.dataset.id);return}
  });
  root.addEventListener('input',function(e){
    if(e.target.id==='bdQ'){S.q=e.target.value;clearTimeout(S.qt);S.qt=setTimeout(function(){var pos=e.target.selectionStart;render();var q=$('#bdQ');q.focus();q.setSelectionRange(pos,pos)},200)}
  });
  root.addEventListener('change',function(e){
    if(e.target.id==='bdMine'){S.mine=e.target.checked;render()}
    else if(e.target.id==='bdAll'){S.allLists=e.target.checked;render()}
    else if(S.cur)taskChange(e);
  });
  root.addEventListener('keydown',taskKey);
  bindDrag();
}

/* ---------- Start ---------- */
var BD={
  async init(rootEl){
    S.root=rootEl;shell();bindEvents();
    var v=store('view');if(v==='list'||v==='cal'||v==='board')S.view=v;
    $('#bdBody').innerHTML='<div class="bdEmpty">Lade Board …</div>';
    if(await load(true)){render();try{var tid=new URLSearchParams(location.search).get('task');if(tid)openTask(tid)}catch(e){}}
    clearInterval(S.timer);
    S.timer=setInterval(function(){if(!document.hidden&&S.root&&S.root.offsetParent!==null)refresh(false)},60000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.root&&S.root.offsetParent!==null)refresh(false)});
  },
  async show(){if(S.loaded)refresh(false);else if(S.root){if(await load(true))render()}},
  stop(){clearInterval(S.timer)}
};
window.BD=BD;
})();
</script>

<script>
(function(){
  var LOCAL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  var API=LOCAL?(location.protocol+'//'+location.hostname+':8799'):'https://vdqumlxjmgqrmwlxqwre.supabase.co/functions/v1/studio-api';
  var KEY='curafact_board_session',IDLE=60*60*1000;
  var sess=null,started=false,idleT=null;
  function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.token&&Date.now()-s.last<IDLE)return s}catch(e){}return null}
  function save(){try{if(sess)localStorage.setItem(KEY,JSON.stringify(sess));else localStorage.removeItem(KEY)}catch(e){}}
  function show(app){document.getElementById('login').classList.toggle('hidden',app);document.getElementById('app').classList.toggle('hidden',!app)}
  function logout(msg){
    if(sess){fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-curafact-session':sess.token},body:JSON.stringify({action:'logout'})}).catch(function(){})}
    sess=null;save();show(false);if(window.BD)BD.stop();started=false;document.getElementById('bdRoot').innerHTML='';
    document.getElementById('loginErr').textContent=msg||'';document.getElementById('code').value='';
  }
  function touch(){if(sess){sess.last=Date.now();save()}}
  ['click','keydown','touchstart','mousemove'].forEach(function(ev){window.addEventListener(ev,function(){if(sess&&Date.now()-sess.last>15000)touch()},{passive:true})});
  setInterval(function(){if(sess&&Date.now()-sess.last>IDLE)logout('Aus Sicherheitsgründen abgemeldet (keine Aktivität).')},30000);
  async function post(action,params){
    var h={'Content-Type':'application/json'};if(sess)h['x-curafact-session']=sess.token;
    var r=await fetch(API,{method:'POST',headers:h,body:JSON.stringify(Object.assign({action:action},params||{}))});
    var j=null;try{j=await r.json()}catch(e){}
    if(!j)return{ok:false,message:'Server-Fehler '+r.status};
    if(j.auth_required){logout('Sitzung abgelaufen. Bitte neu anmelden.')}
    return j;
  }
  window.BD_HOST={
    call:post,
    get user(){return(sess&&sess.user)||{}},
    get isAdmin(){return !!sess&&(sess.user.role==='admin'||sess.user.role==='superadmin')},
    openUrl:function(u){window.open(u,'_blank')}
  };
  function start(){
    show(true);
    document.getElementById('who').innerHTML='Angemeldet: <strong>'+(sess.user.display_name||sess.user.username).replace(/[<>&]/g,'')+'</strong>';
    if(!started){started=true;BD.init(document.getElementById('bdRoot'))}
  }
  document.getElementById('logout').onclick=function(){logout('')};
  document.getElementById('loginForm').addEventListener('submit',async function(e){
    e.preventDefault();var u=document.getElementById('user').value.trim().toLowerCase(),c=document.getElementById('code').value.replace(/\s+/g,'');
    var err=document.getElementById('loginErr');err.textContent='';
    if(!u||!c){err.textContent='Bitte Benutzername und Code eingeben.';return}
    var r=await post('login',{username:u,code:c});
    if(!r.ok){err.textContent=r.message||'Anmeldung fehlgeschlagen.';return}
    sess={token:r.token,user:r.user,last:Date.now()};save();start();
  });
  sess=load();
  if(sess)start();else show(false);
})();
</script>
