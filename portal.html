<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CuraFact Portal</title>
<style>
:root{--blue:#0E4A8B;--blue2:#07345f;--cyan:#20C6D4;--bg:#f5f8fb;--border:#dbe7f0;--text:#16324f;--muted:#66788a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:20px;color:var(--blue);margin:14px 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.box{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box h2{font-size:14px;color:var(--blue);margin:0 0 12px;border-bottom:1px solid var(--border);padding-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px;font-weight:700}
input[type=text],input[type=date],input[type=password],select,textarea{
  width:100%;min-width:0;padding:11px;border:1px solid var(--border);border-radius:9px;font-size:15px;background:#fbfcfe;font-family:inherit;color:var(--text)}
input:focus,textarea:focus{outline:2px solid var(--cyan);outline-offset:1px}
textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:9px;font-size:14px;font-weight:700;padding:11px 16px;cursor:pointer;background:#fff;color:var(--blue);border:1px solid var(--border)}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button:disabled{opacity:.5;cursor:default}
.err{color:#b91c1c;font-size:13px;margin-top:8px;min-height:16px}
.mini{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hidden{display:none!important}

/* --- Login --- */
#loginBox{max-width:360px;margin:60px auto 0;text-align:center}
#loginBox img{height:44px}

/* --- App shell --- */
#appHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 16px;flex-wrap:wrap}
#appHead .who{font-size:13px;color:var(--muted)}
#appHead .who strong{color:var(--blue)}
.grid{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}

#custList{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow:auto}
.custItem{text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#fff;cursor:pointer}
.custItem:hover{border-color:var(--cyan)}
.custItem.sel{border-color:var(--cyan);background:#effcfd}
.custItem strong{font-size:13.5px;color:var(--text)}
.custItem span{font-size:11.5px;color:var(--muted)}

.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
@media(max-width:520px){.detailGrid{grid-template-columns:1fr}}
.field{margin-bottom:6px}
.field .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.field .v{font-size:14.5px;color:var(--text);margin-top:2px}

.calcBox{background:#f2f8fc;border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px}
.calcBox h4{margin:0 0 8px;font-size:12.5px;color:var(--blue);text-transform:uppercase;letter-spacing:.03em}
.calcHead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
.calcHead h3{margin:0 0 4px;font-size:15px;color:var(--blue)}
.calcHead p{margin:2px 0}
.calcTableWrap{overflow-x:auto}
.calcTable{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.calcTable th,.calcTable td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.calcTable .num{text-align:right;font-variant-numeric:tabular-nums}
.calcTable tfoot td{border-top:2px solid var(--border);border-bottom:0}
.calcTable tr.brutto{background:#fef3c7}
.calcTable tr.abzug{background:#fee2e2}
.calcTable tr.netto{background:#dcfce7}
.noteItem{padding:10px 0;border-bottom:1px solid var(--border)}
.noteItem:last-child{border-bottom:0}
.noteItem .meta{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.badge{display:inline-block;background:#eef4fa;color:var(--blue);font-weight:700;font-size:10.5px;padding:1px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.02em}
.activityItem{padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;line-height:1.5}
.activityItem:last-child{border-bottom:0}
.activityItem .badge{margin-right:6px;vertical-align:1px}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginBox">
    <img src="https://dessperado19.github.io/curafact-sign/logo.png" onerror="this.style.display='none'">
    <h1 style="margin-top:6px">CuraFact Portal</h1>
    <p class="sub">Kundendaten, Notizen und ClickUp von unterwegs</p>
    <div class="box" style="text-align:left">
      <label>Benutzername</label>
      <input type="text" id="loginUser" autocomplete="username" placeholder="z.B. onder">
      <label>Code aus der Authenticator-App</label>
      <input type="text" id="loginCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" style="letter-spacing:6px;text-align:center;font-size:20px">
      <div class="err" id="loginErr"></div>
      <button class="primary" id="loginBtn" style="width:100%;margin-top:10px">Anmelden</button>
    </div>
  </div>

  <div id="appBox" class="hidden">
    <div id="appHead">
      <div>
        <h1 style="margin:0">CuraFact Portal</h1>
        <p class="sub" style="margin:2px 0 0">Kundendaten, Notizen und ClickUp</p>
      </div>
      <div class="row" style="align-items:center">
        <span class="who">Angemeldet als <strong id="whoName"></strong></span>
        <button id="logoutBtn">Abmelden</button>
      </div>
    </div>

    <div class="grid">
      <div class="box" style="padding:12px">
        <input type="text" id="custSearch" placeholder="Kunde suchen…" style="margin-bottom:10px">
        <div id="custList"><div class="empty">Lade Kunden …</div></div>
      </div>

      <div id="detailBox">
        <div class="box"><p class="empty">Bitte links einen Kunden auswählen.</p></div>
      </div>
    </div>
  </div>

</div>

<script>
const FN_BASE = "https://vdqumlxjmgqrmwlxqwre.supabase.co/functions/v1";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkcXVtbHhqbWdxcm13bHhxd3JlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg0NTg0NDcsImV4cCI6MjA3NDAzNDQ0N30.sG8vMck4tSDWwsTay_tUujlRDruFjscrrMOhmlkj8Ws";

function esc(v){return String(v??'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))}

async function callFn(name, body){
  try{
    const r = await fetch(`${FN_BASE}/${name}`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+ANON_KEY, 'apikey':ANON_KEY },
      body: JSON.stringify(body||{}),
    });
    return await r.json();
  }catch(e){
    return { ok:false, message: 'Netzwerkfehler: '+e };
  }
}

let session = null; // {token, user}
let customers = [];
let currentCustomer = null;
let lastBerechnung = null; // {html, title} - fuer den Drucken-Button

function saveSession(s){ session = s; try{ sessionStorage.setItem('curafact_portal_session', JSON.stringify(s)); }catch(e){} }
function loadSession(){ try{ const raw = sessionStorage.getItem('curafact_portal_session'); if(raw) session = JSON.parse(raw); }catch(e){} }
function clearSession(){ session = null; try{ sessionStorage.removeItem('curafact_portal_session'); }catch(e){} }

async function doLogin(){
  const user = document.getElementById('loginUser').value.trim();
  const code = document.getElementById('loginCode').value.trim();
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  if(!user || !code){ errEl.textContent = 'Bitte Name und Code eingeben.'; return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Prüfe …';
  const r = await callFn('portal-login', { username:user, code });
  btn.disabled = false; btn.textContent = 'Anmelden';
  if(!r.ok){ errEl.textContent = r.message || 'Anmeldung fehlgeschlagen.'; return; }
  saveSession({ token:r.token, expires_at:r.expires_at, user:r.user });
  showApp();
}

function doLogout(){
  clearSession();
  document.getElementById('appBox').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
  document.getElementById('loginCode').value = '';
}

async function showApp(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('appBox').classList.remove('hidden');
  document.getElementById('whoName').textContent = session.user.display_name || session.user.username;
  await loadCustomers();
}

async function loadCustomers(){
  const r = await callFn('portal-data', { token: session.token, action: 'list_customers' });
  if(!r.ok){
    if(String(r.message||'').includes('Sitzung')){ doLogout(); return; }
    document.getElementById('custList').innerHTML = `<div class="empty">${esc(r.message||'Fehler beim Laden.')}</div>`;
    return;
  }
  customers = r.customers || [];
  renderCustList();
}

function renderCustList(){
  const q = document.getElementById('custSearch').value.trim().toLowerCase();
  const filtered = customers.filter(c => !q || (c.name||'').toLowerCase().includes(q));
  if(!filtered.length){ document.getElementById('custList').innerHTML = '<div class="empty">Keine Kunden gefunden.</div>'; return; }
  document.getElementById('custList').innerHTML = filtered.map(c => `
    <div class="custItem ${currentCustomer===c.name?'sel':''}" data-name="${esc(c.name)}">
      <strong>${esc(c.name)}</strong>
      <span>${esc(c.kasse||'—')}${c.pflegegrad?' · '+esc(c.pflegegrad):''}</span>
    </div>`).join('');
  document.querySelectorAll('.custItem').forEach(el => {
    el.onclick = () => openCustomer(el.dataset.name);
  });
}

async function openCustomer(name){
  currentCustomer = name;
  renderCustList();
  document.getElementById('detailBox').innerHTML = '<div class="box"><p class="empty">Lade …</p></div>';
  const r = await callFn('portal-data', { token: session.token, action: 'get_customer', name });
  if(!r.ok){
    document.getElementById('detailBox').innerHTML = `<div class="box"><p class="empty">${esc(r.message||'Kunde konnte nicht geladen werden.')}</p></div>`;
    return;
  }
  renderDetail(r.customer);
  loadNotes(name);
}

function renderDetail(c){
  const calc = c._last_calculation;

  let html = `<div class="box">
    <h2>Stammdaten</h2>
    <div class="detailGrid">
      <div class="field"><div class="k">Name</div><div class="v">${esc(c.pflege_name||'—')}</div></div>
      <div class="field"><div class="k">Kasse</div><div class="v">${esc(c.pflege_kasse||'—')}</div></div>
      <div class="field"><div class="k">Anschrift</div><div class="v">${esc(c.pflege_anschrift||'—')}</div></div>
      <div class="field"><div class="k">Vers.-Nr.</div><div class="v">${esc(c.pflege_kvnr||'—')}</div></div>
      <div class="field"><div class="k">Geburtsdatum</div><div class="v">${esc(c.pflege_geburtsdatum||'—')}</div></div>
      <div class="field"><div class="k">Pflegeberatung</div><div class="v">${c.pflegeberatung_kunde?'Ja':'Nein'}</div></div>
    </div>`;

  if(Array.isArray(c.pflegegrade) && c.pflegegrade.length){
    html += `<div style="margin-top:10px"><div class="k">Pflegegrade</div>`;
    c.pflegegrade.forEach(pg => {
      html += `<div class="v">PG${esc(pg.stufe||'?')} seit ${esc(pg.von||'—')}${pg.bis?' bis '+esc(pg.bis):''}${pg.fortlaufend?' (fortlaufend)':''}</div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  if(calc && calc.result){
    const res = calc.result;
    lastBerechnung = { html: buildBerechnungHtml(res, calc.at), title: 'Berechnung – ' + (res.kunde && res.kunde.name || c.pflege_name || '') };
    html += `<div class="box"><h2>Letzte Berechnung</h2>
      <p class="mini">Stand: ${esc(calc.at||'')} — aus der Desktop-App, das Portal rechnet nicht selbst neu.</p>
      ${lastBerechnung.html}
      <button class="primary" id="printCalcBtn" style="margin-top:10px">Berechnung drucken</button>
    </div>`;
  } else {
    lastBerechnung = null;
  }

  html += `<div class="box"><h2>ClickUp</h2>
    <p class="mini">Verlauf direkt hier, oder den Task in ClickUp öffnen (Status, ggf. angehängtes Berechnungs-PDF).</p>
    <div class="row" id="clickupLinks" style="margin-top:6px"><span class="empty">Lade …</span></div>
    <div id="clickupActivity" style="margin-top:10px"></div>
  </div>`;

  html += `<div class="box"><h2>Notizen</h2>
    <p class="mini">Wird zusätzlich als Kommentar an den passenden ClickUp-Task gehängt.</p>
    <div id="notesList"><div class="empty">Lade …</div></div>
    <label style="margin-top:10px">Neue Notiz</label>
    <div class="row">
      ${c.pflegeberatung_kunde ? `<select id="noteKontext" style="max-width:160px">
        <option value="abrechnung" selected>Betrifft: Abrechnung</option>
        <option value="beratung">Betrifft: Beratung</option>
        <option value="beides">Betrifft: Beides</option>
      </select>` : ''}
    </div>
    <textarea id="noteText" placeholder="z.B. Kunde bittet um Rückruf wegen ..." style="margin-top:6px"></textarea>
    <button class="primary" id="noteBtn" style="margin-top:8px">Notiz speichern</button>
  </div>`;

  document.getElementById('detailBox').innerHTML = html;

  if(lastBerechnung){
    document.getElementById('printCalcBtn').onclick = () => printBerechnung(lastBerechnung.html, lastBerechnung.title);
  }

  loadClickupLinks(c.pflege_name, !!c.pflegeberatung_kunde);

  document.getElementById('noteBtn').onclick = async () => {
    const text = document.getElementById('noteText').value.trim();
    if(!text) return;
    const kontextEl = document.getElementById('noteKontext');
    const kontext = kontextEl ? kontextEl.value : 'abrechnung';
    const btn = document.getElementById('noteBtn');
    btn.disabled = true;
    const r = await callFn('portal-data', { token: session.token, action:'add_note', customer_name: c.pflege_name, text, kontext });
    btn.disabled = false;
    if(r.ok){ document.getElementById('noteText').value = ''; loadNotes(c.pflege_name); }
  };
}

function fmtEuro(v){ return (Number(v)||0).toFixed(2).replace('.', ','); }

function buildBerechnungHtml(res, atStr){
  const k = res.kunde || {};
  const vpRows = (res.vpRows||[]).map(x => `<tr><td>${esc(x.jahr)}</td><td>${esc(x.start||'')}</td><td>${esc(x.ende||'')}</td><td class="num">${fmtEuro(x.betrag)} €</td></tr>`).join('')
    || '<tr><td colspan="4" class="mini">Keine Verhinderungspflege eingetragen.</td></tr>';
  const pgRows = (res.details||[]).map(d => `<tr><td>PG ${esc(d.stufe)}</td><td>${esc(d.jahr)}</td><td class="num">${esc(d.monate)}</td><td class="num">${fmtEuro(d.pflegegeld_100)} €</td><td class="num">${fmtEuro(d.zukunftsbetrag_mit_entlastung)} €</td><td class="num">${fmtEuro(d.zukunftsbetrag_ohne_entlastung)} €</td><td class="num">${fmtEuro(d.monat_betrag)} €</td><td class="num">${fmtEuro(d.gesamt)} €</td></tr>`).join('')
    || '<tr><td colspan="8" class="mini">Keine anrechenbaren Pflegegrad-Phasen.</td></tr>';
  return `
    <div class="calcHead">
      <div><h3>Auswertung – ${esc(k.name||'')}</h3><p class="mini">${esc(k.anschrift||'')}</p><p class="mini">${esc(k.kasse||'')}${k.kvnr?' · KVNR: '+esc(k.kvnr):''}</p></div>
      <div class="mini">Stand: ${esc(atStr||'')}</div>
    </div>
    <div class="calcBox">
      <h4>Verhinderungspflege / Kurzzeitpflege (Restbeträge)</h4>
      <div class="calcTableWrap"><table class="calcTable"><thead><tr><th>Jahr</th><th>Von</th><th>Bis</th><th class="num">Restbetrag</th></tr></thead>
      <tbody>${vpRows}</tbody>
      <tfoot><tr><td colspan="3" class="num"><b>Summe</b></td><td class="num"><b>${fmtEuro(res.sumVP)} €</b></td></tr></tfoot></table></div>
    </div>
    <div class="calcBox">
      <h4>Pflegegrade – Detaillierte Berechnung</h4>
      <div class="calcTableWrap"><table class="calcTable"><thead><tr><th>PG</th><th>Jahr</th><th class="num">Monate</th><th class="num">Aktuelles PG (100%)</th><th class="num">Zukunftsbetrag (mit)</th><th class="num">Zukunftsbetrag (ohne)</th><th class="num">Monatlich rückw.</th><th class="num">Gesamt rückw.</th></tr></thead>
      <tbody>${pgRows}</tbody>
      <tfoot><tr><td colspan="7" class="num"><b>Summe Rückwirkend</b></td><td class="num"><b>${fmtEuro(res.sumPG)} €</b></td></tr></tfoot></table></div>
    </div>
    <div class="calcBox">
      <table class="calcTable">
        <tbody>
          <tr><td>Gesamt Rückwirkend</td><td class="num"><b>${fmtEuro(res.sumPG)} €</b></td></tr>
          <tr><td>+ Verhinderungspflege</td><td class="num"><b>${fmtEuro(res.sumVP)} €</b></td></tr>
          <tr class="brutto"><td><b>= Bruttogesamt</b></td><td class="num"><b>${fmtEuro(res.brutto)} €</b></td></tr>
          <tr class="abzug"><td><b>Abzug (${fmtEuro(res.abzugPct)} %)</b></td><td class="num"><b>− ${fmtEuro(res.abzug)} €</b></td></tr>
          <tr class="netto"><td><b>Nettogesamt</b></td><td class="num"><b>${fmtEuro(res.netto)} €</b></td></tr>
        </tbody>
      </table>
    </div>`;
}

function printBerechnung(html, title){
  // Druckt ueber ein verstecktes iframe in derselben Seite statt window.open() -
  // so gibt es kein Risiko, dass Safaris Popup-Blocker den Druckdialog verhindert.
  let iframe = document.getElementById('print_iframe');
  if(!iframe){
    iframe = document.createElement('iframe');
    iframe.id = 'print_iframe';
    iframe.style.position = 'fixed';
    iframe.style.right = '0';
    iframe.style.bottom = '0';
    iframe.style.width = '0';
    iframe.style.height = '0';
    iframe.style.border = '0';
    iframe.style.visibility = 'hidden';
    document.body.appendChild(iframe);
  }
  const w = iframe.contentWindow;
  const styles = `<style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#16324f;margin:0}
    .page{padding:18px}
    .calcHead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}
    .calcHead h3{margin:0 0 4px;color:#0E4A8B}
    .calcHead p{margin:2px 0;color:#66788a}
    .mini{font-size:12px;color:#66788a}
    .calcBox{border:1px solid #dbe7f0;border-radius:10px;padding:12px;margin:10px 0}
    .calcBox h4{margin:0 0 8px;color:#0E4A8B;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
    .calcTable{width:100%;border-collapse:collapse;font-size:11.5px}
    .calcTable th,.calcTable td{padding:5px 6px;border-bottom:1px solid #dbe7f0;text-align:left;vertical-align:top}
    .calcTable .num{text-align:right}
    .calcTable tr.brutto{background:#fef3c7}
    .calcTable tr.abzug{background:#fee2e2}
    .calcTable tr.netto{background:#dcfce7}
    @media print{.page{padding:0}.calcBox{break-inside:avoid}@page{size:A4 portrait;margin:10mm}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style>`;
  w.document.open();
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title||'Berechnung')}</title>${styles}</head><body><div class="page">${html}</div></body></html>`);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 150);
}

async function loadClickupLinks(name, pflegeberatung){
  const el = document.getElementById('clickupLinks');
  const activityEl = document.getElementById('clickupActivity');
  if(!el) return;
  const r = await callFn('portal-data', { token: session.token, action:'get_clickup_links', name, pflegeberatung: !!pflegeberatung });
  if(!r.ok){
    el.innerHTML = `<span class="empty">${esc(r.message||'ClickUp-Verknüpfung konnte nicht geladen werden.')}</span>`;
    if(activityEl) activityEl.innerHTML = '';
    return;
  }
  const links = [];
  if(r.pflegekunden_url) links.push(`<a href="${esc(r.pflegekunden_url)}" target="_blank" rel="noopener"><button>Pflegekunden-Task öffnen ↗</button></a>`);
  if(r.pflegeberatung_url) links.push(`<a href="${esc(r.pflegeberatung_url)}" target="_blank" rel="noopener"><button>Pflegeberatungs-Task öffnen ↗</button></a>`);
  el.innerHTML = links.length ? links.join('') : '<span class="empty">Noch kein ClickUp-Task für diesen Kunden gefunden.</span>';
  if(activityEl){
    const activity = (r.activity || []).slice().reverse();
    activityEl.innerHTML = activity.length
      ? activity.map(a => `<div class="activityItem"><span class="badge">${esc(a.checklist)}</span> ${esc(a.text)}</div>`).join('')
      : '<div class="empty">Noch keine Aktivität erfasst.</div>';
  }
}

const NOTE_KONTEXT_LABEL = { abrechnung: 'Abrechnung', beratung: 'Beratung', beides: 'Beides' };
async function loadNotes(name){
  const r = await callFn('portal-data', { token: session.token, action:'list_notes', customer_name: name });
  const el = document.getElementById('notesList');
  if(!el) return;
  if(!r.ok){ el.innerHTML = `<div class="empty">${esc(r.message||'Notizen konnten nicht geladen werden.')}</div>`; return; }
  const notes = r.notes || [];
  el.innerHTML = notes.length ? notes.map(n => `
    <div class="noteItem">
      <div class="meta">${esc(n.display_name||n.username||'')} · ${esc((n.created_at||'').replace('T',' ').slice(0,16))}${n.kontext ? ` · <span class="badge">${esc(NOTE_KONTEXT_LABEL[n.kontext]||n.kontext)}</span>` : ''}</div>
      <div>${esc(n.text)}</div>
    </div>`).join('') : '<div class="empty">Noch keine Notizen.</div>';
}

document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('loginCode').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
document.getElementById('logoutBtn').onclick = doLogout;
document.getElementById('custSearch').addEventListener('input', renderCustList);

loadSession();
if(session && session.expires_at && new Date(session.expires_at) > new Date()){
  showApp();
} else {
  clearSession();
}
</script>
</body></html>
